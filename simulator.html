<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<!-- 允許雙指縮放：不要加 user-scalable=no -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三川工方｜施工模擬</title>
<style>
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --line:#DFE4EC; --line2:#C6CEDC;
  --text:#1B2331; --muted:#5C687C; --faint:#96A0B2;
  --gold:#B8912E; --gold2:#8A6B14;
  --shade:#E7EBF1; --red:#C0392B; --green:#2E9E5B;
  --font:'PingFang TC','Noto Sans TC','Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}

.hd{display:flex;align-items:center;gap:10px;padding:14px 0 16px}
.hd-t{font-size:16px;font-weight:800;color:var(--gold2);letter-spacing:1px}
.keybtn{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--card);
        border:1px solid var(--line2);border-radius:9px;padding:8px 12px;cursor:pointer;
        color:var(--text);font-size:12px;font-family:var(--font)}
.kdot{width:8px;height:8px;border-radius:50%;background:#bbb;flex-shrink:0}

.block{margin-bottom:22px}
.label{font-size:13px;font-weight:700;margin-bottom:8px}

.drop{border:2px dashed var(--line2);border-radius:14px;padding:48px 20px;text-align:center;
      cursor:pointer;background:var(--card)}
.drop:active{border-color:var(--gold)}
.drop-i{font-size:36px;margin-bottom:10px}
.drop-t{font-size:15px;font-weight:700}
.drop-s{font-size:12.5px;color:var(--muted);margin-top:6px}

.photo{width:100%;border-radius:14px;display:block;background:var(--shade);border:1px solid var(--line)}
.pbar{display:flex;gap:8px;margin-top:9px}
.pb{background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:9px 14px;
    cursor:pointer;color:var(--muted);font-size:12.5px;font-family:var(--font)}
.pb:active{border-color:var(--gold);color:var(--gold2)}

textarea{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:12px;
         color:var(--text);font-family:var(--font);font-size:15px;padding:13px;outline:none;
         resize:none;min-height:96px;line-height:1.6}
textarea:focus{border-color:var(--gold)}
textarea::placeholder{color:var(--faint)}

.refrow{display:flex;align-items:center;gap:12px;margin-top:10px}
.refbtn{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px dashed var(--line2);
        border-radius:11px;padding:11px 15px;cursor:pointer;color:var(--muted);font-size:13px;
        font-family:var(--font)}
.refbtn:active{border-color:var(--gold);color:var(--gold2)}
.refimg{width:58px;height:58px;border-radius:11px;object-fit:cover;border:2px solid var(--gold);flex-shrink:0}
.refx{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;
      font-family:var(--font);text-decoration:underline;padding:4px}

.go{width:100%;background:var(--gold);border:none;border-radius:13px;padding:17px;cursor:pointer;
    color:#1B1400;font-size:16px;font-weight:800;font-family:var(--font);letter-spacing:1px}
.go:disabled{opacity:.4}

.msg{padding:13px;border-radius:11px;background:var(--card);border:1px solid var(--line);
     font-size:13px;margin-top:14px;line-height:1.75;display:flex;align-items:center;gap:10px}
.msg.err{background:#FDF0EE;border-color:#F0C8C2;color:#8E2A1D;display:block;word-break:break-word}
.msg a{color:var(--gold2)}
.msg .fix{display:inline-block;margin-top:9px;background:var(--gold);border:none;border-radius:9px;
          padding:9px 14px;cursor:pointer;color:#1B1400;font-size:13px;font-weight:700;font-family:var(--font)}
.spin{width:17px;height:17px;border:2px solid var(--line2);border-top-color:var(--gold);
      border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}

.res{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.res img{width:100%;display:block;background:var(--shade)}
.res-b{padding:12px 14px;border-top:1px solid var(--line)}
.res-t{font-size:14px;font-weight:700;line-height:1.5}
.res-r{display:flex;align-items:center;gap:9px;margin-top:7px}
.res-r img{width:34px;height:34px;border-radius:7px;object-fit:cover;border:1px solid var(--line2);flex-shrink:0}
.res-s{font-size:11.5px;color:var(--faint)}
.res-btns{display:flex;gap:8px;margin-top:11px}
.rb{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:10px;
    cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600;font-family:var(--font)}
.rb:active{border-color:var(--gold);color:var(--gold2)}

.ov{position:fixed;inset:0;background:rgba(27,35,49,.45);z-index:200}
.mo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:201;width:min(400px,92vw);
    background:var(--card);border-radius:15px;padding:22px}
.mo-t{font-size:16px;font-weight:800;color:var(--gold2);margin-bottom:9px}
.mo-d{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.75}
.mo input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;
          color:var(--text);font-family:ui-monospace,Menlo,monospace;font-size:12.5px;padding:12px;outline:none}
.kinfo{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6;word-break:break-word;min-height:1px}
.kinfo.bad{color:var(--red)}
.kinfo.ok{color:var(--green)}
.mo-r{display:flex;gap:8px;margin-top:15px}
.mo-r button{flex:1;border-radius:10px;padding:12px 6px;cursor:pointer;font-family:var(--font);
             font-size:13px;font-weight:700;border:1px solid var(--line2);background:transparent;color:var(--muted)}
.mo-r .main{background:var(--gold);color:#1B1400;border-color:var(--gold)}
.hide{display:none !important}
</style>
</head>
<body>

<div class="wrap">

  <div class="hd">
    <div class="hd-t">三川工方 · 施工模擬</div>
    <button class="keybtn" onclick="showKey()">
      <span class="kdot" id="kdot"></span><span>金鑰</span>
    </button>
  </div>

  <!-- 1. 照片 -->
  <div class="block">
    <input type="file" id="f-photo" accept="image/*" class="hide">
    <div class="drop" id="drop" onclick="document.getElementById('f-photo').click()">
      <div class="drop-i">📷</div>
      <div class="drop-t">上傳現況照片</div>
      <div class="drop-s">點這裡選照片或拍照</div>
    </div>
    <div class="hide" id="photobox">
      <img class="photo" id="photo" alt="現況照片">
      <div class="pbar">
        <button class="pb" onclick="document.getElementById('f-photo').click()">換一張照片</button>
      </div>
    </div>
  </div>

  <!-- 2. 描述 -->
  <div class="block">
    <div class="label">想改成什麼樣子？</div>
    <textarea id="ask" placeholder="例：把系統櫃門片換成深胡桃木，霧面不要反光"></textarea>
    <div class="refrow" id="refrow"></div>
    <input type="file" id="f-ref" accept="image/*" class="hide">
  </div>

  <!-- 3. 開始 -->
  <div class="block">
    <button class="go" id="go" onclick="run()">開始模擬</button>
    <div id="msg"></div>
  </div>

  <!-- 結果 -->
  <div id="results"></div>

</div>

<script>
"use strict";

var BUILD    = "08/12 02:40";
var API_KEY  = localStorage.getItem("gemini_api_key") || "";
var MAX_EDGE = 1536;

var photo = null;    // {url, b64}
var ref   = null;    // {name, url, b64}
var busy  = false;
var results = [];

function $(id){ return document.getElementById(id); }

function setMsg(html, kind){
  $("msg").innerHTML = html ? '<div class="msg' + (kind ? " " + kind : "") + '">' + html + "</div>" : "";
}

function refreshGo(){
  var b = $("go");
  var described = !!($("ask").value.trim() || ref);
  b.disabled = busy || !photo || !described;
  b.textContent = busy ? "模擬中…"
                : !photo ? "請先上傳現況照片"
                : !described ? "請描述想改成什麼樣子"
                : "開始模擬";
}

// 讀圖並縮到合理大小
function readImage(file, maxEdge){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var sc = Math.min(1, maxEdge / Math.max(im.width, im.height));
        var c = document.createElement("canvas");
        c.width  = Math.round(im.width  * sc);
        c.height = Math.round(im.height * sc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        var url = c.toDataURL("image/jpeg", 0.92);
        resolve({ url: url, b64: url.split(",")[1] });
      };
      im.onerror = function(){ reject(new Error("圖片讀取失敗")); };
      im.src = fr.result;
    };
    fr.onerror = function(){ reject(new Error("檔案讀取失敗")); };
    fr.readAsDataURL(file);
  });
}

$("f-photo").onchange = async function(){
  var f = this.files && this.files[0];
  this.value = "";
  if(!f) return;
  try{
    photo = await readImage(f, MAX_EDGE);
    $("photo").src = photo.url;
    $("drop").classList.add("hide");
    $("photobox").classList.remove("hide");
    setMsg("");
    refreshGo();
  }catch(e){ setMsg("照片載入失敗：" + e.message, "err"); }
};

$("f-ref").onchange = async function(){
  var f = this.files && this.files[0];
  var nm = f ? (f.name || "參考圖").replace(/\.[^.]+$/, "").slice(0, 16) : "";
  this.value = "";
  if(!f) return;
  try{
    var r = await readImage(f, 768);
    ref = { name: nm || "參考圖", url: r.url, b64: r.b64 };
    renderRef();
    refreshGo();
  }catch(e){ setMsg("參考圖載入失敗：" + e.message, "err"); }
};

function renderRef(){
  $("refrow").innerHTML = ref
    ? '<img class="refimg" src="' + ref.url + '">' +
      '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700">' + ref.name + "</div>" +
      '<div style="font-size:11.5px;color:var(--faint)">AI 會照這張的顏色與紋理做</div></div>' +
      '<button class="refx" onclick="clearRef()">移除</button>'
    : '<button class="refbtn" onclick="document.getElementById(\'f-ref\').click()">' +
      '<span style="font-size:17px">＋</span> 加一張顏色參考圖</button>';
}

function clearRef(){ ref = null; renderRef(); refreshGo(); }

// 不寫死型號：問這把金鑰有哪些影像模型可用
var MODEL_KEY = "sim_img_model";
var imgModel = localStorage.getItem(MODEL_KEY) || "";

async function pickModel(force){
  if(imgModel && !force) return imgModel;
  var r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",
                      { headers: { "x-goog-api-key": API_KEY } });
  var d = await r.json();
  if(d.error) throw new Error(d.error.message);

  var best = null, bestScore = -1;
  (d.models || []).forEach(function(m){
    var n = String(m.name).replace(/^models\//, "");
    var meth = m.supportedGenerationMethods || m.supported_generation_methods || [];
    if(meth.indexOf("generateContent") < 0) return;
    if(!/gemini/i.test(n) || !/image/i.test(n)) return;
    if(/imagen|veo|embedding/i.test(n)) return;
    var v = (n.match(/gemini-(\d+(?:\.\d+)?)/i) || [0, 0])[1];
    var sc = parseFloat(v) * 100 + (/flash/i.test(n) ? 20 : 0);
    if(sc > bestScore){ bestScore = sc; best = n; }
  });
  if(!best) throw new Error("這把金鑰沒有可用的影像模型。");
  imgModel = best;
  localStorage.setItem(MODEL_KEY, best);
  return best;
}

function buildPrompt(){
  var text = $("ask").value.trim() || "換成這張參考圖的材質";
  var lines = [
    "你是室內裝修的照片級視覺化工具。以【圖1 現況照片】為基底，輸出一張同尺寸、同視角、同構圖的寫實照片。",
    "",
    "使用者的要求：「" + text + "」",
    ""
  ];
  if(ref) lines.push("顏色與紋理請以【圖2 參考圖】為準。", "");
  lines.push(
    "任務：依照上面這句話修改照片中對應的部位。你要自己判斷他指的是畫面中的哪個東西、範圍到哪裡，只改那個部位，其餘完全保持原樣。",
    "",
    "必須遵守：",
    "1. 完整保留原照片的光影、明暗、陰影與反光，換材質後仍要符合現場光線。",
    "2. 保留原本的透視、板材分割線、縫隙、門片邊界與五金位置。",
    "3. 若為木紋，紋理方向順著原本板材的長邊延伸，比例符合實際尺度。",
    "4. 除了指定的部位以外，其他所有內容必須與原圖完全一致。",
    "5. 邊界要貼合物件的真實輪廓，不可溢出到相鄰的面。",
    "6. 不要加入文字、浮水印或邊框。",
    "",
    "輸出：僅一張寫實的模擬照片。"
  );
  return lines.join("\n");
}

async function run(){
  if(busy) return;
  if(!API_KEY){ showKey(); return; }
  if(!photo){ setMsg("請先上傳現況照片", "err"); return; }

  busy = true; refreshGo();
  setMsg('<span class="spin"></span><span>模擬中，約 10～30 秒…</span>');

  var text = $("ask").value.trim();
  try{
    var model = await pickModel(false);
    var parts = [
      { text: "【圖1】現況照片：" },
      { inline_data: { mime_type: "image/jpeg", data: photo.b64 } }
    ];
    if(ref){
      parts.push({ text: "【圖2】顏色參考圖：" });
      parts.push({ inline_data: { mime_type: "image/jpeg", data: ref.b64 } });
    }
    parts.push({ text: buildPrompt() });

    var body = { contents: [{ role: "user", parts: parts }],
                 generationConfig: { responseModalities: ["IMAGE"] } };

    var data = null;
    for(var att = 0; att < 2; att++){
      var res = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
        { method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": API_KEY },
          body: JSON.stringify(body) });
      data = await res.json();
      if(!data.error) break;
      // 型號被下架就重挑一次
      if(att === 0 && /no longer available|not found|NOT_FOUND|does not exist/i.test(data.error.message)){
        model = await pickModel(true);
        continue;
      }
      throw new Error(data.error.message + "（模型：" + model + "）");
    }

    var ps = (data.candidates && data.candidates[0] && data.candidates[0].content &&
              data.candidates[0].content.parts) || [];
    var img = null;
    for(var i = 0; i < ps.length; i++){
      var q = ps[i].inlineData || ps[i].inline_data;
      if(q && q.data){ img = q; break; }
    }
    if(!img){
      var why = (data.candidates && data.candidates[0] && data.candidates[0].finishReason) || "";
      throw new Error("模型沒有回傳圖片" + (why ? "（" + why + "）" : "") + "，換句話說說看再試一次。");
    }

    results.unshift({
      url: "data:" + (img.mimeType || img.mime_type || "image/png") + ";base64," + img.data,
      text: text || "照參考圖的材質",
      refUrl: ref ? ref.url : "",
      refName: ref ? ref.name : "",
      at: new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" })
    });
    renderResults();
    setMsg("");
    $("results").scrollIntoView({ behavior: "smooth", block: "start" });
  }catch(e){
    setMsg(errText(e.message || ""), "err");
  }finally{
    busy = false; refreshGo();
  }
}

function errText(m){
  var fix = '<br><button class="fix" onclick="showKey()">開啟金鑰設定</button>';
  if(/API key not valid|API_KEY_INVALID/i.test(m))
    return "金鑰不對或已被刪除。" + fix;
  if(/limit:\s*0/i.test(m))
    return "<b>免費方案對影像模型的額度是 0，要先開啟計費。</b><br>" +
           '到 <a href="https://console.cloud.google.com/billing" target="_blank" rel="noopener">console.cloud.google.com/billing</a> ' +
           "建立帳單帳戶並連結到金鑰所屬的專案。";
  if(/quota|RESOURCE_EXHAUSTED|rate limit/i.test(m))
    return "短時間內請求太多，等 30～60 秒再試一次。";
  if(/SERVICE_DISABLED|has not been used|PERMISSION_DENIED/i.test(m))
    return "這個專案還沒啟用 Generative Language API。" + fix;
  return m;
}

function renderResults(){
  $("results").innerHTML = results.map(function(r, i){
    return '<div class="res">' +
      '<img src="' + r.url + '">' +
      '<div class="res-b">' +
        '<div class="res-t">' + r.text + "</div>" +
        (r.refUrl ? '<div class="res-r"><img src="' + r.refUrl + '">' +
                    '<span class="res-s">參考：' + r.refName + "</span></div>" : "") +
        '<div class="res-s" style="margin-top:5px">' + r.at + "</div>" +
        '<div class="res-btns">' +
          '<button class="rb" onclick="share(' + i + ')">分享</button>' +
          '<button class="rb" onclick="save(' + i + ')">下載</button>' +
        "</div>" +
      "</div></div>";
  }).join("");
}

// 下載／分享的圖，下緣燒上這是哪一個顏色，之後才不會分不出來
function labelled(r){
  return new Promise(function(resolve){
    var im = new Image();
    im.onload = function(){
      var bar = Math.max(60, Math.round(im.width * 0.08));
      var c = document.createElement("canvas");
      c.width = im.width; c.height = im.height + bar;
      var x = c.getContext("2d");
      x.drawImage(im, 0, 0);
      x.fillStyle = "#FFFFFF"; x.fillRect(0, im.height, c.width, bar);
      x.fillStyle = "#DFE4EC"; x.fillRect(0, im.height, c.width, 2);
      var pad = Math.round(bar * 0.18), box = bar - pad * 2, tx = pad;

      function txt(){
        x.fillStyle = "#8A6B14";
        x.font = "700 " + Math.round(bar * 0.34) + "px sans-serif";
        x.fillText(r.refName || "模擬方案", tx, im.height + pad + Math.round(bar * 0.34));
        x.fillStyle = "#5C687C";
        x.font = "400 " + Math.round(bar * 0.24) + "px sans-serif";
        var d = r.text.length > 32 ? r.text.slice(0, 32) + "…" : r.text;
        x.fillText(d, tx, im.height + pad + Math.round(bar * 0.7));
        resolve(c);
      }
      if(r.refUrl){
        var ri = new Image();
        ri.onload = function(){ x.drawImage(ri, pad, im.height + pad, box, box); tx = pad * 2 + box; txt(); };
        ri.onerror = txt;
        ri.src = r.refUrl;
      }else txt();
    };
    im.src = r.url;
  });
}

async function save(i){
  var c = await labelled(results[i]);
  var a = document.createElement("a");
  a.download = "施工模擬_" + (results[i].refName || "方案") + ".jpg";
  a.href = c.toDataURL("image/jpeg", 0.95);
  a.click();
}

async function share(i){
  var r = results[i];
  var c = await labelled(r);
  var blob = await new Promise(function(res){ c.toBlob(res, "image/jpeg", 0.92); });
  var f = new File([blob], "施工模擬.jpg", { type: "image/jpeg" });
  if(navigator.canShare && navigator.canShare({ files: [f] })){
    try{ await navigator.share({ files: [f], text: r.text }); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  save(i);
}

// ── 金鑰 ──
function showKey(){
  var old = $("keymo"); if(old) old.remove();
  var d = document.createElement("div");
  d.id = "keymo";
  d.innerHTML =
    '<div class="ov" onclick="closeKey()"></div>' +
    '<div class="mo">' +
      '<div class="mo-t">Google Gemini 金鑰</div>' +
      '<div class="mo-d">到 <b>aistudio.google.com/apikey</b> 申請，貼進來按「測試」確認。' +
      '金鑰只存在這台手機的瀏覽器。<br><span style="color:var(--faint)">版本 ' + BUILD + "</span></div>" +
      '<input id="keyin" type="text" placeholder="AIza..." autocomplete="off" spellcheck="false" ' +
        'autocapitalize="off" autocorrect="off" value="' + API_KEY + '">' +
      '<div class="kinfo" id="kinfo"></div>' +
      '<div class="mo-r">' +
        '<button onclick="closeKey()">取消</button>' +
        '<button onclick="testKey()">測試</button>' +
        '<button class="main" onclick="saveKey()">儲存</button>' +
      "</div></div>";
  document.body.appendChild(d);
}
function closeKey(){ var m = $("keymo"); if(m) m.remove(); }
function clean(s){ return (s || "").replace(/\s+/g, ""); }

async function testKey(){
  var el = $("kinfo"), v = clean($("keyin").value);
  if(!v){ el.textContent = "請先貼上金鑰"; el.className = "kinfo bad"; return; }
  if(v.indexOf("AIza") !== 0){
    el.textContent = "⚠ 金鑰應該以 AIza 開頭，你可能複製到金鑰的名稱";
    el.className = "kinfo bad"; return;
  }
  el.textContent = "測試中…"; el.className = "kinfo";
  try{
    var r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1",
                        { headers: { "x-goog-api-key": v } });
    var d = await r.json();
    if(d.error){ el.textContent = "✕ " + d.error.message; el.className = "kinfo bad"; }
    else { el.textContent = "✓ 金鑰有效，按「儲存」就能用"; el.className = "kinfo ok"; }
  }catch(e){ el.textContent = "✕ 連線失敗：" + e.message; el.className = "kinfo bad"; }
}

function saveKey(){
  var v = clean($("keyin").value);
  API_KEY = v;
  if(v) localStorage.setItem("gemini_api_key", v);
  else localStorage.removeItem("gemini_api_key");
  imgModel = ""; localStorage.removeItem(MODEL_KEY);
  closeKey(); paintKey(); refreshGo();
}

function paintKey(){
  $("kdot").style.background = API_KEY ? "var(--green)" : "#bbb";
}

$("ask").oninput = refreshGo;
paintKey();
renderRef();
refreshGo();
</script>

</body>
</html>
