<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三川工方｜施工前後模擬</title>
<style>
:root{
  --bg:#0D1117; --sb:#131920; --card:#1A2230; --card2:#1E2840;
  --border:#243040; --border2:#2E3D52;
  --gold:#C9A84C; --gold2:#E8C97A; --gold-bg:rgba(201,168,76,0.08);
  --text:#E8EDF5; --muted:#4A5E78; --muted2:#6A7E98;
  --green:#4AB87A; --red:#D05050; --blue:#4A8CD0;
  --font:'PingFang TC','Noto Sans TC','Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6}

.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}

/* header */
.hd{position:sticky;top:0;z-index:50;background:rgba(13,17,23,0.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);margin:0 -16px 20px;padding:14px 16px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd-t{font-size:15px;font-weight:800;color:var(--gold);letter-spacing:1px}
.hd-s{font-size:10px;color:var(--muted2);letter-spacing:.5px}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:8px}

.keybtn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border2);
        border-radius:8px;padding:7px 11px;cursor:pointer;color:var(--text);font-size:12px;font-family:var(--font)}
.keybtn:hover{border-color:var(--gold)}
.kdot{width:7px;height:7px;border-radius:50%;background:#555;flex-shrink:0}

select,input[type=text]{background:var(--card);border:1px solid var(--border2);border-radius:8px;
        color:var(--text);font-family:var(--font);font-size:12px;padding:7px 10px;outline:none}
select:focus,input[type=text]:focus{border-color:var(--gold)}

/* step card */
.step{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.step-n{width:24px;height:24px;border-radius:7px;background:var(--gold-bg);border:1px solid var(--gold);
        color:var(--gold);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-t{font-size:14px;font-weight:700}
.step-d{font-size:11px;color:var(--muted2);margin-left:auto;text-align:right}
.step.done .step-n{background:var(--green);border-color:var(--green);color:#0D1117}

/* drop zone */
.drop{border:1.5px dashed var(--border2);border-radius:12px;padding:26px 16px;text-align:center;
      cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-bg)}
.drop-i{font-size:26px;margin-bottom:6px;opacity:.7}
.drop-t{font-size:13px;font-weight:600}
.drop-s{font-size:11px;color:var(--muted2);margin-top:3px}

/* 模擬條件（顏色圖層） */
.lay-wrap{background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:12px;margin-bottom:12px}
.lay-t{font-size:12.5px;font-weight:700;color:var(--gold2);margin-bottom:9px}
.lay-row{display:flex;gap:7px;flex-wrap:wrap}
.lay{display:flex;align-items:center;gap:7px;background:var(--card);border:1.5px solid var(--border2);
     border-radius:9px;padding:7px 10px;cursor:pointer;font-family:var(--font);transition:all .15s}
.lay:hover{border-color:var(--gold2)}
.lay.on{border-color:var(--gold);background:var(--gold-bg)}
.lay-dot{width:14px;height:14px;border-radius:4px;flex-shrink:0;border:1px solid rgba(0,0,0,.35)}
.lay-nm{font-size:12px;font-weight:700;color:var(--text)}
.lay-mt{font-size:10.5px;color:var(--muted2)}
.lay.on .lay-mt{color:var(--gold2)}
.lay-x{color:var(--muted);font-size:14px;padding:0 2px;line-height:1}
.lay-x:hover{color:var(--red)}
.lay-add{background:transparent;border:1.5px dashed var(--border2);border-radius:9px;padding:7px 12px;
         cursor:pointer;color:var(--muted2);font-size:12px;font-weight:600;font-family:var(--font)}
.lay-add:hover{border-color:var(--gold);color:var(--gold2)}

/* canvas */
.stage{position:relative;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--border2);
       line-height:0;touch-action:none}
.stage canvas{width:100%;height:auto;display:block;cursor:crosshair;touch-action:none}

/* toolbar */
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.tbtn{display:flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--border2);
      border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--text);font-size:12px;
      font-family:var(--font);font-weight:600;transition:all .15s}
.tbtn:hover{border-color:var(--gold2)}
.tbtn.on{background:var(--gold);border-color:var(--gold);color:#0D1117}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
.tsep{width:1px;height:22px;background:var(--border2)}
.brush{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border2);
       border-radius:8px;padding:6px 12px;flex:1;min-width:180px}
.brush.off{opacity:.4}
.brush label{font-size:11px;color:var(--muted2);white-space:nowrap}
.brush input[type=range]{flex:1;accent-color:var(--gold);min-width:60px}
.brush .bv{font-size:11px;color:var(--gold);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}

.hint{background:var(--gold-bg);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;
      padding:9px 12px;font-size:11.5px;color:var(--gold2);margin-top:12px;line-height:1.65}

/* AI 自動框選 */
.autosel{background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:13px;margin-bottom:12px}
.autosel-t{font-size:12.5px;font-weight:700;color:var(--gold2);margin-bottom:8px}
.autorow{display:flex;gap:8px;flex-wrap:wrap}
.autorow input[type=text]{flex:1;min-width:150px}
.gobtn{background:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:8px 14px;
       cursor:pointer;color:#0D1117;font-size:12.5px;font-weight:700;font-family:var(--font);
       white-space:nowrap;transition:all .15s}
.gobtn:hover:not(:disabled){background:var(--gold2)}
.gobtn:disabled{opacity:.45;cursor:wait}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.qchip{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:5px 12px;
       cursor:pointer;color:var(--muted2);font-size:11.5px;font-family:var(--font);transition:all .15s}
.qchip:hover{border-color:var(--gold);color:var(--gold2)}

#seg-list{margin-top:11px}
.segrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;
        background:var(--card);border:1px solid var(--border2);margin-bottom:6px;cursor:pointer}
.segrow input{accent-color:var(--gold);width:16px;height:16px;flex-shrink:0}
.segdot{width:13px;height:13px;border-radius:4px;flex-shrink:0}
.segnm{font-size:12.5px;flex:1;min-width:0}
.segpc{font-size:10.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
.segmsg{font-size:11.5px;color:var(--muted2);margin-top:8px;line-height:1.65}
.segmsg.err{color:#F0A0A0}

/* 材質分類 */
.cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;
      scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;background:var(--card2);border:1px solid var(--border2);border-radius:20px;
     padding:7px 15px;cursor:pointer;color:var(--muted2);font-size:12.5px;font-weight:600;
     font-family:var(--font);white-space:nowrap;transition:all .15s}
.cat:hover{border-color:var(--gold2);color:var(--gold2)}
.cat.on{background:var(--gold);border-color:var(--gold);color:#0D1117}

.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.mat{background:var(--card2);border:1.5px solid var(--border2);border-radius:10px;overflow:hidden;
     cursor:pointer;padding:0;font-family:var(--font);text-align:left;transition:all .15s}
.mat:hover{border-color:var(--gold2)}
.mat.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-bg)}
.mat .sw{height:52px;width:100%;display:block}
.mat .nm{display:block;padding:6px 8px;font-size:11.5px;font-weight:600;color:var(--text);line-height:1.35}
.mat.on .nm{color:var(--gold2)}

.picked{display:flex;align-items:center;gap:10px;background:var(--gold-bg);border:1px solid var(--gold);
        border-radius:10px;padding:9px 11px;margin-bottom:12px}
.picked .psw{width:34px;height:34px;border-radius:7px;flex-shrink:0;border:1px solid var(--border2)}
.picked .ptx{flex:1;min-width:0;font-size:12px;line-height:1.5}
.picked .pnm{font-weight:700;color:var(--gold2)}
.picked .pds{color:var(--muted2);font-size:11px}
.picked .px{background:none;border:none;color:var(--muted2);font-size:17px;cursor:pointer;
            padding:2px 5px;font-family:var(--font);flex-shrink:0}
.picked .px:hover{color:var(--red)}

.forlay{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border2);
        border-radius:16px;padding:4px 11px;font-size:11.5px;color:var(--muted2);margin-left:auto}
.forlay .lay-dot{width:12px;height:12px}

/* swatch upload */
.sw-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-top:14px}
.sw-prev{width:104px;height:104px;border-radius:10px;border:1px solid var(--border2);
         object-fit:cover;flex-shrink:0;background:var(--card2)}
.sw-side{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px}
.fld label{display:block;font-size:11px;color:var(--muted2);margin-bottom:4px}
.fld input[type=text]{width:100%}
.opt{font-size:10px;color:var(--muted);font-weight:400}
.note{font-size:11.5px;color:var(--muted2);line-height:1.7}

textarea{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:9px;
         color:var(--text);font-family:var(--font);font-size:13px;padding:11px;outline:none;
         resize:vertical;min-height:70px;line-height:1.65}
textarea:focus{border-color:var(--gold)}
textarea::placeholder{color:var(--muted)}

/* go */
.go{width:100%;background:var(--gold);border:none;border-radius:11px;padding:15px;cursor:pointer;
    color:#0D1117;font-size:15px;font-weight:800;font-family:var(--font);letter-spacing:1px;transition:all .15s}
.go:hover:not(:disabled){background:var(--gold2)}
.go:disabled{opacity:.4;cursor:not-allowed}
.go.busy{opacity:.7;cursor:wait}

/* 結果 */
.vtabs{display:flex;gap:6px;margin-left:auto}
.vt{background:var(--card2);border:1px solid var(--border2);border-radius:7px;padding:6px 12px;
    cursor:pointer;color:var(--muted2);font-size:11.5px;font-weight:600;font-family:var(--font)}
.vt.on{background:var(--gold);border-color:var(--gold);color:#0D1117}

.resbox{border-radius:12px;overflow:hidden;border:1px solid var(--border2);background:#000;line-height:0}
.resbox img{width:100%;height:auto;display:block}

.cmp{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border2);
     background:#000;line-height:0;touch-action:none;user-select:none}
.cmp img{width:100%;height:auto;display:block}
.cmp .after{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cmp-bar{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);pointer-events:none;
         box-shadow:0 0 10px rgba(201,168,76,.7)}
.cmp-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;
          border-radius:50%;background:var(--gold);border:2px solid #0D1117;display:flex;
          align-items:center;justify-content:center;color:#0D1117;font-size:13px;font-weight:800}
.cmp-tag{position:absolute;top:10px;padding:3px 9px;border-radius:6px;background:rgba(13,17,23,.8);
         font-size:10px;font-weight:700;letter-spacing:1px;line-height:1.8}
.cmp-tag.l{left:10px;color:var(--muted2)}
.cmp-tag.r{right:10px;color:var(--gold)}

.opts{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted2);cursor:pointer}
.chk input{accent-color:var(--gold);width:15px;height:15px}

.stat{display:flex;align-items:center;gap:9px;padding:12px;border-radius:10px;
      background:var(--card2);font-size:12.5px;margin-top:12px;line-height:1.7}
.stat.err{background:rgba(208,80,80,.1);color:#F0A0A0;display:block;word-break:break-word}
.stat a{color:var(--gold2);text-decoration:underline}
.spin{width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--gold);
      border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;
       background:var(--card2);border:1px solid var(--gold);color:var(--gold2);
       border-radius:10px;padding:11px 16px;font-size:12.5px;max-width:88vw;text-align:center;
       box-shadow:0 6px 24px rgba(0,0,0,.5)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200}
.mo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:201;width:min(420px,92vw);
    background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:22px}
.mo-t{font-size:15px;font-weight:800;color:var(--gold);margin-bottom:8px}
.mo-d{font-size:12px;color:var(--muted2);margin-bottom:14px;line-height:1.7}
.mo input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:9px;
          color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
          font-size:12px;padding:11px;outline:none}
.mo input:focus{border-color:var(--gold)}
.keyinfo{font-size:11.5px;color:var(--muted2);margin-top:9px;line-height:1.65;word-break:break-word;min-height:1px}
.keyinfo.warn{color:#F0A0A0}
.keyinfo.ok{color:var(--green)}
.mo-r{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mo-r button{flex:1;min-width:82px;border-radius:9px;padding:11px 8px;cursor:pointer;font-family:var(--font);
             font-size:13px;font-weight:700;border:1px solid var(--border2)}
.mo-c{background:transparent;color:var(--muted2)}
.mo-s{background:var(--gold);color:#0D1117;border-color:var(--gold)}

.hide{display:none !important}
@media(max-width:520px){
  .step{padding:13px}
  .tbtn{padding:9px 11px}
  .hd-s{display:none}
  .mats{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
}
</style>
</head>
<body>

<div class="wrap">

  <div class="hd">
    <div>
      <div class="hd-t">三川工方</div>
      <div class="hd-s">施工前後模擬 · Material Simulator</div>
    </div>
    <div class="hd-r">
      <select id="model" title="生成模型">
        <option value="gemini-3-pro-image-preview">Nano Banana Pro（畫質最好）</option>
        <option value="gemini-3.1-flash-image-preview" selected>Nano Banana 2（快 · 便宜）</option>
        <option value="gemini-2.5-flash-image">Nano Banana（舊版）</option>
      </select>
      <button class="keybtn" onclick="showKey()">
        <span class="kdot" id="kdot"></span><span id="klabel">設定金鑰</span>
      </button>
    </div>
  </div>

  <!-- STEP 1 -->
  <div class="step" id="s1">
    <div class="step-h">
      <div class="step-n">1</div>
      <div class="step-t">上傳現況照片並圈選範圍</div>
      <div class="step-d" id="s1d">尚未上傳</div>
    </div>
    <input type="file" id="f-photo" accept="image/*" class="hide">
    <div class="drop" id="d-photo">
      <div class="drop-i">📷</div>
      <div class="drop-t">點擊或拖曳現況照片</div>
      <div class="drop-s">工地現場照 · 建議正對牆面拍攝、光線平均</div>
    </div>

    <div class="hide" id="photo-box">

      <div class="lay-wrap">
        <div class="lay-t">模擬條件 — 一個顏色一種材質，可以同時做好幾種</div>
        <div class="lay-row" id="lay-row"></div>
      </div>

      <div class="autosel">
        <div class="autosel-t">✨ 用講的圈選 — 說出部位，AI 幫你分出邊界</div>
        <div class="autorow">
          <input type="text" id="seg-q" placeholder="例：牆面、地板、門片"
                 autocomplete="off" oninput="refreshGo()" onkeydown="if(event.key==='Enter')autoSelect()">
          <button class="gobtn" id="seg-btn" onclick="autoSelect()">AI 自動框選</button>
        </div>
        <div class="qchips">
          <button class="qchip" onclick="segQuick('牆面')">牆面</button>
          <button class="qchip" onclick="segQuick('地板')">地板</button>
          <button class="qchip" onclick="segQuick('天花板')">天花板</button>
          <button class="qchip" onclick="segQuick('櫃體')">櫃體</button>
          <button class="qchip" onclick="segQuick('門片')">門片</button>
          <button class="qchip" onclick="segQuick('檯面')">檯面</button>
          <button class="qchip" onclick="segQuick('窗框')">窗框</button>
          <button class="qchip" onclick="segQuick('踢腳板')">踢腳板</button>
        </div>
        <div id="seg-status"></div>
        <div id="seg-list"></div>
      </div>

      <div class="stage"><canvas id="cv"></canvas></div>

      <div class="tools">
        <button class="tbtn on" id="t-tap"     onclick="setMode('tap')">👆 點選</button>
        <button class="tbtn"    id="t-paint"   onclick="setMode('paint')">🖌 塗抹</button>
        <button class="tbtn"    id="t-line"    onclick="setMode('line')">📏 直線</button>
        <button class="tbtn"    id="t-rect"    onclick="setMode('rect')">▭ 方框</button>
        <button class="tbtn"    id="t-ellipse" onclick="setMode('ellipse')">◯ 圓形</button>
        <button class="tbtn"    id="t-erase"   onclick="setMode('erase')">🧽 擦除</button>
      </div>

      <div class="tools">
        <button class="tbtn" id="t-undo" onclick="undo()" disabled>↶ 復原</button>
        <button class="tbtn" onclick="clearMask()">✕ 清除此色</button>
        <button class="tbtn" onclick="selectAll()">▣ 全選</button>
        <div class="tsep"></div>
        <button class="tbtn" onclick="resetPhoto()">↺ 換照片</button>
      </div>

      <div class="tools">
        <div class="brush" id="brush-row">
          <label id="brush-label">筆刷粗細</label>
          <input type="range" id="bsize" min="8" max="200" value="48" oninput="onBrush()">
          <span class="bv" id="bval">48</span>
        </div>
      </div>

      <div class="hint" id="tool-hint"></div>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="step" id="s2">
    <div class="step-h">
      <div class="step-n">2</div>
      <div class="step-t">選擇材質</div>
      <div class="forlay" id="forlay"></div>
    </div>

    <div id="picked-box"></div>

    <div class="cats" id="cats"></div>
    <div class="mats" id="mats"></div>

    <div class="fld" style="margin-top:14px">
      <label>補充需求 <span class="opt">選填，可以直接打字</span></label>
      <textarea id="desc" oninput="onDesc()"
        placeholder="例：顏色再淺一階、木紋要垂直走向、不要太反光"></textarea>
    </div>

    <div class="sw-row">
      <input type="file" id="f-swatch" accept="image/*" class="hide">
      <img class="sw-prev hide" id="sw-prev" alt="色板預覽">
      <div class="drop" id="d-swatch" style="width:104px;height:104px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0">
        <div class="drop-i" style="margin:0">🪵</div>
        <div class="drop-s" style="margin-top:2px">選色板</div>
      </div>
      <div class="sw-side">
        <div class="fld">
          <label>實際色板照片 <span class="opt">選填，最準</span></label>

// 狀態
// ============================================================
var MAX_EDGE = 1536;
var API_KEY  = localStorage.getItem("gemini_api_key") || "";

// 一個顏色 = 一組模擬條件。標記色刻意選現場不會出現的螢光色。
var LAYER_COLORS = [
  { hex:"#FF00E5", name:"洋紅" },
  { hex:"#00E5FF", name:"青色" },
  { hex:"#B4FF00", name:"黃綠" },

// ============================================================
// 小工具
// ============================================================
function $(id){ return document.getElementById(id); }

function mkCanvas(w,h){
  var c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}

function toast(msg){
  var old = document.querySelector(".toast");
  if(old) old.remove();
  var d = document.createElement("div");
  d.className = "toast";
  d.innerHTML = msg;
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 3200);
}

function setStatus(html, kind){
  var el = $("status");
  if(!html){ el.innerHTML = ""; return; }
  el.innerHTML = '<div class="stat' + (kind === "err" ? " err" : "") + '">' + html + "</div>";
}

function fileToImage(file){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload  = function(){ resolve({ img: img, dataUrl: fr.result }); };
      img.onerror = function(){ reject(new Error("圖片讀取失敗")); };
      img.src = fr.result;
    };
    fr.onerror = function(){ reject(new Error("檔案讀取失敗")); };
    fr.readAsDataURL(file);
  });
}

function canvasToParts(canvas, quality){
  var url = canvas.toDataURL("image/jpeg", quality || 0.92);
  return { mime: "image/jpeg", b64: url.split(",")[1] };
}

function bindDrop(dropId, inputId, handler){
  var drop  = $(dropId);
  var input = $(inputId);
  drop.onclick = function(){ input.click(); };
  input.onchange = function(){ if(input.files[0]) handler(input.files[0]); input.value = ""; };
  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function(e){
    var f = e.dataTransfer.files[0];
    if(f && f.type.indexOf("image/") === 0) handler(f);
  });
}

// 遮罩上某點是否有內容
function hitCanvas(c, p){
  if(!c) return false;
  var x = Math.round(p.x), y = Math.round(p.y);
  if(x < 0 || y < 0 || x >= c.width || y >= c.height) return false;
  return c.getContext("2d").getImageData(x, y, 1, 1).data[3] > 40;
}

function canvasCoverage(c){
  if(!c) return 0;
  var s = 120;
  var t = mkCanvas(s, s);
  var tx = t.getContext("2d");
  tx.drawImage(c, 0, 0, s, s);
  var d = tx.getImageData(0, 0, s, s).data;
  var n = 0;
  for(var i = 3; i < d.length; i += 4){ if(d[i] > 12) n++; }
  return n / (s * s) * 100;
}

// ============================================================
// 圖層（模擬條件）
// ============================================================
function newLayer(ci){
  return {
    ci: ci,
    mask: photo ? mkCanvas(photo.w, photo.h) : null,
    regions: [],          // AI 圈出來的區塊，可以再點一下取消
    picked: null,         // 材質色票
    desc: "",             // 補充需求
    swatch: null          // 實際色板照片
  };
}

function L(){ return layers[actL]; }
function LC(){ return LAYER_COLORS[L().ci]; }
function layerName(i){ return "條件 " + (i + 1); }

function layerTargetName(l){
  if(l.picked) return l.picked.name;
  if(l.swatch) return "色板";
  if(l.desc)   return l.desc.length > 6 ? l.desc.slice(0, 6) + "…" : l.desc;
  return "未選材質";
}

function layerHasMask(l){ return l && l.mask && canvasCoverage(l.mask) > 0.01; }
function anyMask(){ return layers.some(layerHasMask); }

function renderLayers(){
  var html = layers.map(function(l, i){
    var c = LAYER_COLORS[l.ci];
    return '<div class="lay' + (i === actL ? " on" : "") + '" onclick="setLayer(' + i + ')">' +
             '<span class="lay-dot" style="background:' + c.hex + '"></span>' +
             '<span class="lay-nm">' + layerName(i) + '</span>' +
             '<span class="lay-mt">' + layerTargetName(l) + '</span>' +
             (layers.length > 1
               ? '<span class="lay-x" onclick="event.stopPropagation();delLayer(' + i + ')">✕</span>'
               : "") +
           "</div>";
  }).join("");
  if(layers.length < LAYER_COLORS.length){
    html += '<button class="lay-add" onclick="addLayer()">＋ 新增條件</button>';
  }
  $("lay-row").innerHTML = html;

  var c = LC();
  $("forlay").innerHTML =
    '<span class="lay-dot" style="background:' + c.hex + '"></span>套用到 ' + layerName(actL);
}

function addLayer(){
  var used = layers.map(function(l){ return l.ci; });
  var ci = 0;
  for(var i = 0; i < LAYER_COLORS.length; i++){
    if(used.indexOf(i) < 0){ ci = i; break; }
  }
  layers.push(newLayer(ci));
  actL = layers.length - 1;
  clearSeg();
  syncAll();
}

function delLayer(i){
  if(layers.length <= 1) return;
  layers.splice(i, 1);
  if(actL >= layers.length) actL = layers.length - 1;
  undoStack = undoStack.filter(function(u){ return u.li < layers.length; });
  $("t-undo").disabled = !undoStack.length;
  clearSeg();
  syncAll();
}

function setLayer(i){
  if(i === actL) return;
  actL = i;
  clearSeg();
  syncAll();
}

// 圖層切換後，把畫面與第二步的材質欄位一起同步
function syncAll(){
  renderLayers();
  renderMats();
  renderPicked();
  renderSwatch();
  $("desc").value = L() ? L().desc : "";
  redraw();
  syncStep2();
}

// ============================================================
// STEP 1 — 照片
// ============================================================
async function loadPhoto(file){
  try{
    var r = await fileToImage(file);
    var img = r.img;

    var scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
    var w = Math.round(img.width  * scale);
    var h = Math.round(img.height * scale);

    var base = mkCanvas(w, h);
    base.getContext("2d").drawImage(img, 0, 0, w, h);
    photo = { canvas: base, w: w, h: h };

    layers = [newLayer(0)];
    actL = 0;
    undoStack = [];
    $("t-undo").disabled = true;

    tintC = mkCanvas(w, h);
    tintX = tintC.getContext("2d");

    cv = $("cv"); cv.width = w; cv.height = h;
    ctx = cv.getContext("2d");
    bindCanvas();

    $("d-photo").classList.add("hide");
    $("photo-box").classList.remove("hide");
    $("s1").classList.add("done");
    $("s1d").textContent = w + " × " + h;
    clearSeg();
    syncAll();
  }catch(e){
    setStatus("照片載入失敗：" + e.message, "err");
  }
}

function resetPhoto(){
  photo = null; layers = []; result = null; segRegions = [];
  $("d-photo").classList.remove("hide");
  $("photo-box").classList.add("hide");
  $("s1").classList.remove("done");
  $("s1d").textContent = "尚未上傳";
  $("s4").classList.add("hide");
  setStatus("");
  refreshGo();
}

// 底圖 + 每個圖層各自的顏色 + 尚未套用的候選區
function redraw(preview){
  if(!photo || !ctx) return;
  ctx.clearRect(0, 0, photo.w, photo.h);
  ctx.drawImage(photo.canvas, 0, 0);

  function overlay(src, hex, alpha){
    tintX.clearRect(0, 0, photo.w, photo.h);
    tintX.drawImage(src, 0, 0);
    tintX.globalCompositeOperation = "source-in";
    tintX.fillStyle = hex;
    tintX.fillRect(0, 0, photo.w, photo.h);
    tintX.globalCompositeOperation = "source-over";
    ctx.globalAlpha = alpha;
    ctx.drawImage(tintC, 0, 0);
    ctx.globalAlpha = 1;
  }

  layers.forEach(function(l, i){
    if(!l.mask) return;
    overlay(l.mask, LAYER_COLORS[l.ci].hex, i === actL ? 0.5 : 0.32);
  });

  if(segRegions.length){
    var fs = Math.max(13, Math.round(photo.w * 0.026));
    segRegions.forEach(function(r){
      if(!r.on) return;
      overlay(r.canvas, r.color, 0.5);
      ctx.font = "700 " + fs + "px sans-serif";
      var tw = ctx.measureText(r.label).width;
      var lx = Math.min(Math.max(4, r.box.x0), photo.w - tw - 16);
      var ly = Math.min(Math.max(4, r.box.y0), photo.h - fs - 12);
      ctx.fillStyle = "rgba(13,17,23,0.82)";
      ctx.fillRect(lx, ly, tw + 14, fs + 10);
      ctx.fillStyle = r.color;
      ctx.fillText(r.label, lx + 7, ly + fs + 1);
    });
  }

  if(preview) preview(ctx);
}

// ---- 工具 ----
function isBrushMode(){ return mode === "paint" || mode === "erase"; }
function isShapeMode(){ return mode === "line" || mode === "rect" || mode === "ellipse"; }

function setMode(m){
  mode = m;
  ["tap","paint","line","rect","ellipse","erase"].forEach(function(k){
    $("t-" + k).classList.toggle("on", k === m);
  });

  var usesBrush = (m === "paint" || m === "erase" || m === "line");
  $("brush-row").classList.toggle("off", !usesBrush);
  $("bsize").disabled = !usesBrush;
  $("brush-label").textContent = (m === "line") ? "線條粗細" : "筆刷粗細";
  $("tool-hint").innerHTML = TOOL_HINT[m];

  if(m === "erase" && !layerHasMask(L())){
    toast("這個顏色還沒有選取任何範圍，<br>先用「點選」或「塗抹」選起來再擦除");
  }
}

function onBrush(){
  brush = parseInt($("bsize").value, 10);
  $("bval").textContent = brush;
}

function pushUndo(){
  var l = L();
  if(!l || !l.mask) return;
  var snap = mkCanvas(photo.w, photo.h);
  snap.getContext("2d").drawImage(l.mask, 0, 0);
  undoStack.push({ li: actL, canvas: snap, regions: l.regions.slice() });
  if(undoStack.length > 24) undoStack.shift();
  $("t-undo").disabled = false;
}

function undo(){
  if(!undoStack.length) return;
  var u = undoStack.pop();
  var l = layers[u.li];
  if(l){
    var mx = l.mask.getContext("2d");
    mx.clearRect(0, 0, photo.w, photo.h);
    mx.drawImage(u.canvas, 0, 0);
    l.regions = u.regions;
    actL = u.li;
  }
  $("t-undo").disabled = undoStack.length === 0;
  syncAll();
}

function clearMask(){
  if(!photo) return;
  pushUndo();
  L().mask.getContext("2d").clearRect(0, 0, photo.w, photo.h);
  L().regions = [];
  redraw(); refreshGo(); renderLayers();
}

function selectAll(){
  if(!photo) return;
  pushUndo();
  var mx = L().mask.getContext("2d");
  mx.globalCompositeOperation = "source-over";
  mx.fillStyle = "#fff";
  mx.fillRect(0, 0, photo.w, photo.h);
  redraw(); refreshGo(); renderLayers();
}

function toCanvasPt(e){
  var r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (photo.w / r.width),
    y: (e.clientY - r.top)  * (photo.h / r.height)
  };
}

function paintAt(p){
  var mx = L().mask.getContext("2d");
  mx.globalCompositeOperation = (mode === "erase") ? "destination-out" : "source-over";
  mx.strokeStyle = "#fff";
  mx.fillStyle   = "#fff";
  mx.lineCap = "round";
  mx.lineJoin = "round";
  mx.lineWidth = brush;

  if(lastPt){
    mx.beginPath();
    mx.moveTo(lastPt.x, lastPt.y);
    mx.lineTo(p.x, p.y);
    mx.stroke();
  }else{
    mx.beginPath();
    mx.arc(p.x, p.y, brush / 2, 0, Math.PI * 2);
    mx.fill();
  }
  mx.globalCompositeOperation = "source-over";
  lastPt = p;
}

function shapePath(c, a, b){
  if(mode === "line"){
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y);
  }else if(mode === "rect"){
    c.beginPath();
    c.rect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y));
  }else if(mode === "ellipse"){
    c.beginPath();
    c.ellipse((a.x+b.x)/2, (a.y+b.y)/2, Math.abs(b.x-a.x)/2, Math.abs(b.y-a.y)/2, 0, 0, Math.PI*2);
  }
}

function commitShape(a, b){
  var mx = L().mask.getContext("2d");
  mx.globalCompositeOperation = "source-over";
  mx.fillStyle = "#fff"; mx.strokeStyle = "#fff";
  mx.lineCap = "round"; mx.lineJoin = "round";
  mx.lineWidth = brush;
  shapePath(mx, a, b);
  if(mode === "line") mx.stroke(); else mx.fill();
}

function previewShape(a, b){
  var hex = LC().hex;
  return function(c){
    c.save();
    c.globalAlpha = 0.5;
    c.fillStyle = hex; c.strokeStyle = hex;
    c.lineCap = "round"; c.lineJoin = "round";
    shapePath(c, a, b);
    if(mode === "line"){ c.lineWidth = brush; c.stroke(); }
    else{
      c.fill();
      c.globalAlpha = 1;
      c.lineWidth = Math.max(2, photo.w * 0.003);
      c.setLineDash([photo.w * 0.012, photo.w * 0.008]);
      c.stroke();
    }
    c.restore();
  };
}

function bindCanvas(){
  cv.onpointerdown = function(e){
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    drawing = true; moved = false;
    startPt = toCanvasPt(e);
    lastPt = null;

    // 候選區還在畫面上時，點一下就是開關那一塊
    if(segRegions.length && hitSeg(startPt) >= 0) return;
    if(mode === "tap") return;

    pushUndo();
    if(isBrushMode()){ paintAt(startPt); redraw(); }
    else redraw(previewShape(startPt, startPt));
  };

  cv.onpointermove = function(e){
    if(!drawing) return;
    e.preventDefault();
    var p = toCanvasPt(e);
    if(Math.abs(p.x - startPt.x) > 3 || Math.abs(p.y - startPt.y) > 3) moved = true;
    if(mode === "tap") return;
    if(isBrushMode()){ paintAt(p); redraw(); }
    else redraw(previewShape(startPt, p));
  };

  cv.onpointerup = cv.onpointercancel = function(e){
    if(!drawing) return;
    drawing = false;
    var p = toCanvasPt(e);
    try{ cv.releasePointerCapture(e.pointerId); }catch(err){}

    var hit = segRegions.length ? hitSeg(startPt) : -1;
    if(hit >= 0 && !moved){
      segRegions[hit].on = !segRegions[hit].on;
      renderSegList();
      redraw();
    }else if(mode === "tap"){
      if(!moved) tapSelect(p);
    }else{
      if(isShapeMode()) commitShape(startPt, p);
      redraw();
      refreshGo();
      renderLayers();
    }
    lastPt = null; startPt = null;
  };
}

function hitSeg(p){
  for(var i = segRegions.length - 1; i >= 0; i--){
    if(hitCanvas(segRegions[i].canvas, p)) return i;
  }
  return -1;
}

// ============================================================
// AI 自動框選（Gemini image segmentation）
// ============================================================
var SEG_MODEL  = "gemini-2.5-flash";
var SEG_COLORS = ["#4A8CD0","#4AB87A","#E07B39","#9B6BC6","#3AAFA9","#D05050","#C9A84C","#D4A017"];
var segRegions = [];

function segQuick(t){ $("seg-q").value = t; autoSelect(); }

function segMsg(html, err){
  $("seg-status").innerHTML = html
    ? '<div class="segmsg' + (err ? " err" : "") + '">' + html + "</div>" : "";
}

function segBody(prompt){
  var basePart = canvasToParts(photo.canvas, 0.9);
  return {
    contents: [{ role: "user", parts: [
      { inline_data: { mime_type: basePart.mime, data: basePart.b64 } },
      { text: prompt }
    ]}],
    generationConfig: {
      responseMimeType: "application/json",
      thinkingConfig: { thinkingBudget: 0 }
    }
  };
}

var SEG_FORMAT =
  "輸出一個 JSON 陣列，每個項目包含：\n" +
  '- "box_2d"：該區域的邊界框 [ymin, xmin, ymax, xmax]，數值正規化到 0-1000\n' +
  '- "mask"：該邊界框內的分割遮罩，base64 PNG\n' +
  '- "label"：繁體中文標籤\n';

async function callSeg(prompt){
  var res = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/" + SEG_MODEL + ":generateContent",
    { method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": API_KEY },
      body: JSON.stringify(segBody(prompt)) }
  );
  var data = await res.json();
  if(data.error) throw new Error(data.error.message || "API 錯誤");
  var txt = "";
  var ps = (data.candidates && data.candidates[0] && data.candidates[0].content &&
            data.candidates[0].content.parts) || [];
  for(var i = 0; i < ps.length; i++){ if(ps[i].text) txt += ps[i].text; }
  return parseSegJson(txt);
}

async function autoSelect(){
  if(!photo){ toast("請先上傳現況照片"); return; }
  var q = $("seg-q").value.trim();
  if(!q){ toast("請先輸入或點選要模擬的部位"); return; }
  if(!API_KEY){ showKey(); return; }

  var btn = $("seg-btn");
  btn.disabled = true;
  btn.textContent = "辨識中…";
  segMsg('<span class="spin" style="display:inline-block;vertical-align:-3px"></span> 正在辨識「' + q + '」的範圍，約 5～15 秒…');
  $("seg-list").innerHTML = "";
  segRegions = [];
  redraw();

  try{
    var items = await callSeg(
      "這是一張室內裝修的現場照片。請找出畫面中所有屬於「" + q + "」的區域。\n\n" + SEG_FORMAT +
      "\n規則：\n" +
      "1. 只輸出畫面中真實存在的區域，沒有就回傳空陣列 []。\n" +
      "2. 嚴格貼合物件的真實輪廓，不要把相鄰的牆面、地板、天花板或家具一起圈進來。\n" +
      "3. 同一類若有多塊分開的面（例如三片門片、兩面牆），務必一片一個項目分開列出，" +
      "標籤加上編號，例如「門片 1」「門片 2」。\n" +
      "4. 最多 10 個項目。");

    if(!items.length){
      segMsg("找不到「" + q + "」。換個說法試試（例如「主牆」「木作櫃」），或用「👆 點選」直接點畫面上的物件。", true);
      return;
    }
    await showSegItems(items, "點畫面上的色塊或下面的清單可以逐一開關，確認後按「套用」。");
  }catch(e){
    segMsg("自動框選失敗：" + (e.message || ""), true);
  }finally{
    btn.disabled = false;
    btn.textContent = "AI 自動框選";
  }
}

// 點一下畫面 -> 抓出該點所在的那個物件
async function tapSelect(p){
  if(!API_KEY){ showKey(); return; }

  // 已經在目前顏色的某個區塊裡 -> 取消該區塊
  var l = L();
  for(var i = l.regions.length - 1; i >= 0; i--){
    if(hitCanvas(l.regions[i].canvas, p)){
      pushUndo();
      var mx = l.mask.getContext("2d");
      mx.globalCompositeOperation = "destination-out";
      mx.drawImage(l.regions[i].canvas, 0, 0);
      mx.globalCompositeOperation = "source-over";
      var nm = l.regions[i].label;
      l.regions.splice(i, 1);
      redraw(); refreshGo(); renderLayers();
      toast("已取消「" + nm + "」");
      return;
    }
  }

  var px = (p.x / photo.w * 100).toFixed(1);
  var py = (p.y / photo.h * 100).toFixed(1);
  segMsg('<span class="spin" style="display:inline-block;vertical-align:-3px"></span> 正在辨識你點的位置…');
  try{
    var items = await callSeg(
      "這是一張室內裝修的現場照片。畫面上有一個指定點，位於水平方向 " + px +
      "%、垂直方向 " + py + "% 的位置（左上角為 0%,0%）。\n\n" +
      "請找出「涵蓋這個點的那一個獨立表面或物件」，例如單獨一片門片、一整面牆、地板、一片檯面。\n\n" + SEG_FORMAT +
      "\n規則：\n" +
      "1. 只回傳一個項目，就是涵蓋該點的那一個物件。\n" +
      "2. 嚴格貼合它的真實輪廓，不要把相鄰的面一起圈進來。\n" +
      "3. 若該點落在牆上就只回傳那一面牆，落在某一片門片上就只回傳那一片門片。");

    if(!items.length){ segMsg("這個位置抓不到明確的物件，換個地方點，或改用「方框」手動框。", true); return; }
    var r = await regionFromItem(items[0], 0);
    if(!r){ segMsg("遮罩無法解析，請改用手動工具框選。", true); return; }

    pushUndo();
    var mx2 = L().mask.getContext("2d");
    mx2.globalCompositeOperation = "source-over";
    mx2.drawImage(r.canvas, 0, 0);
    L().regions.push({ label: r.label, canvas: r.canvas });
    segMsg("已加入「" + r.label + "」。再點它一次就可以取消。");
    redraw(); refreshGo(); renderLayers();
  }catch(e){
    segMsg("點選辨識失敗：" + (e.message || ""), true);
  }
}

async function showSegItems(items, msg){
  var regions = [];
  for(var j = 0; j < items.length; j++){
    var r = await regionFromItem(items[j], j);
    if(r) regions.push(r);
  }
  if(!regions.length){
    segMsg("有偵測到範圍，但遮罩無法解析。請改用手動工具框選。", true);
    return;
  }
  segRegions = regions;
  renderSegList();
  redraw();
  segMsg(msg);
}

function parseSegJson(txt){
  if(!txt) return [];
  var s = txt.replace(/```json|```/g, "").trim();
  var out;
  try{ out = JSON.parse(s); }
  catch(e){
    var a = s.indexOf("["), b = s.lastIndexOf("]");
    if(a < 0 || b < a) return [];
    try{ out = JSON.parse(s.slice(a, b + 1)); }catch(e2){ return []; }
  }
  if(!Array.isArray(out)) out = [out];
  return out.filter(function(o){ return o && o.box_2d && o.mask; });
}

function regionFromItem(item, idx){
  return new Promise(function(resolve){
    var b = item.box_2d;
    var y0 = Math.round(b[0] / 1000 * photo.h);
    var x0 = Math.round(b[1] / 1000 * photo.w);
    var y1 = Math.round(b[2] / 1000 * photo.h);
    var x1 = Math.round(b[3] / 1000 * photo.w);
    var bw = Math.max(1, x1 - x0), bh = Math.max(1, y1 - y0);
    if(bw < 2 || bh < 2){ resolve(null); return; }

    var src = String(item.mask);
    if(src.indexOf("data:") !== 0) src = "data:image/png;base64," + src;

    var im = new Image();
    im.onload = function(){
      var t = mkCanvas(bw, bh);
      var tx = t.getContext("2d");
      tx.drawImage(im, 0, 0, bw, bh);

      // 機率圖 -> 二值 alpha
      // 灰階不透明（官方格式）看灰階值；若形狀存在 alpha 則看 alpha
      var d = tx.getImageData(0, 0, bw, bh);
      var p = d.data, on = 0;
      for(var i = 0; i < p.length; i += 4){
        var v = (p[i + 3] < 250) ? p[i + 3] : p[i];
        if(v > 127){ p[i] = p[i+1] = p[i+2] = 255; p[i+3] = 255; on++; }
        else { p[i+3] = 0; }
      }
      tx.putImageData(d, 0, 0);
      if(!on){ resolve(null); return; }

      var full = mkCanvas(photo.w, photo.h);
      full.getContext("2d").drawImage(t, x0, y0);

      resolve({
        label: item.label || ("範圍 " + (idx + 1)),
        canvas: full,
        color: SEG_COLORS[idx % SEG_COLORS.length],
        on: true,
        pct: (on / (photo.w * photo.h) * 100),
        box: { x0: x0, y0: y0 }
      });
    };
    im.onerror = function(){ resolve(null); };
    im.src = src;
  });
}

function renderSegList(){
  if(!segRegions.length){ $("seg-list").innerHTML = ""; return; }
  var rows = segRegions.map(function(r, i){
    return '<label class="segrow">' +
      '<input type="checkbox"' + (r.on ? " checked" : "") + ' onchange="toggleSeg(' + i + ',this.checked)">' +
      '<span class="segdot" style="background:' + r.color + '"></span>' +
      '<span class="segnm">' + r.label + '</span>' +
      '<span class="segpc">' + r.pct.toFixed(1) + "%</span>" +
    "</label>";
  }).join("");
  $("seg-list").innerHTML = rows +
    '<div class="tools" style="margin-top:9px">' +
      '<button class="gobtn" onclick="applySeg()">✓ 套用為選取範圍</button>' +
      '<button class="tbtn" onclick="addSeg()">＋ 加到現有選取</button>' +
      '<button class="tbtn" onclick="clearSeg()">✕ 取消</button>' +
    "</div>";
}

function toggleSeg(i, on){ segRegions[i].on = on; redraw(); }

function writeSeg(replace){
  var chosen = segRegions.filter(function(r){ return r.on; });
  if(!chosen.length){ toast("請至少勾選一個範圍"); return; }
  pushUndo();
  var l = L();
  var mx = l.mask.getContext("2d");
  if(replace){ mx.clearRect(0, 0, photo.w, photo.h); l.regions = []; }
  mx.globalCompositeOperation = "source-over";
  chosen.forEach(function(r){
    mx.drawImage(r.canvas, 0, 0);
    l.regions.push({ label: r.label, canvas: r.canvas });
  });
  segRegions = [];
  $("seg-list").innerHTML = "";
  segMsg("已套用到 " + layerName(actL) + "。用「👆 點選」點那一塊可以再取消，或用塗抹／擦除微調。");
  redraw(); refreshGo(); renderLayers();
}

function applySeg(){ writeSeg(true); }
function addSeg(){ writeSeg(false); }

function clearSeg(){
  segRegions = [];
  var el = $("seg-list");
  if(el) el.innerHTML = "";
  segMsg("");
  redraw();
}

// ============================================================
// STEP 2 — 材質（綁在目前的顏色圖層上）
// ============================================================
function renderCats(){
  $("cats").innerHTML = MATERIALS.map(function(g, i){
    return '<button class="cat' + (i === curCat ? " on" : "") +
           '" onclick="setCat(' + i + ')">' + g.cat + "</button>";
  }).join("");
}

function setCat(i){ curCat = i; renderCats(); renderMats(); }

function renderMats(){
  var picked = L() ? L().picked : null;
  $("mats").innerHTML = MATERIALS[curCat].items.map(function(m, j){
    var on = (picked && picked.name === m.name) ? " on" : "";
    return '<button class="mat' + on + '" onclick="pickMat(' + curCat + "," + j + ')">' +
             '<span class="sw" style="background:' + m.css + '"></span>' +
             '<span class="nm">' + m.name + "</span>" +
           "</button>";
  }).join("");
}

function pickMat(ci, ji){
  if(!L()){ toast("請先上傳現況照片"); return; }
  var m = MATERIALS[ci].items[ji];
  L().picked = (L().picked && L().picked.name === m.name) ? null : m;
  renderMats(); renderPicked(); renderLayers(); syncStep2();
}

function renderPicked(){
  var box = $("picked-box");
  var p = L() ? L().picked : null;
  if(!p){ box.innerHTML = ""; return; }
  box.innerHTML =
    '<div class="picked">' +
      '<span class="psw" style="background:' + p.css + '"></span>' +
      '<span class="ptx"><span class="pnm">' + p.name + "</span>" +
        '<br><span class="pds">' + p.desc + "</span></span>" +
      '<button class="px" onclick="clearPicked()" title="取消">✕</button>' +
    "</div>";
}

function clearPicked(){
  if(!L()) return;
  L().picked = null;
  renderMats(); renderPicked(); renderLayers(); syncStep2();
}

function renderSwatch(){
  var s = L() ? L().swatch : null;
  var prev = $("sw-prev");
  if(s){
    prev.src = s.dataUrl;
    prev.classList.remove("hide");
    $("d-swatch").classList.add("hide");
    $("sw-clear").classList.remove("hide");
  }else{
    prev.classList.add("hide");
    prev.removeAttribute("src");
    $("d-swatch").classList.remove("hide");
    $("sw-clear").classList.add("hide");
  }
}

async function loadSwatch(file){
  if(!L()){ toast("請先上傳現況照片"); return; }
  try{
    var r = await fileToImage(file);
    var img = r.img;
    var scale = Math.min(1, 768 / Math.max(img.width, img.height));
    var c = mkCanvas(Math.round(img.width * scale), Math.round(img.height * scale));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    var p = canvasToParts(c, 0.95);
    L().swatch = { dataUrl: r.dataUrl, mime: p.mime, b64: p.b64 };
    renderSwatch(); renderLayers(); syncStep2();
  }catch(e){
    setStatus("色板載入失敗：" + e.message, "err");
  }
}

function clearSwatch(){
  if(!L()) return;
  L().swatch = null;
  renderSwatch(); renderLayers(); syncStep2();
}

function onDesc(){
  if(L()) L().desc = $("desc").value;
  renderLayers();
  syncStep2();
}

function layerHasTarget(l){ return !!(l && (l.picked || l.swatch || (l.desc || "").trim())); }

function syncStep2(){
  var ok = layerHasTarget(L());
  $("s2").classList.toggle("done", ok);
  refreshGo();
}

// ============================================================
// STEP 3 — 生成
// ============================================================
function areaText(){
  return $("part").value.trim() || $("seg-q").value.trim();
}

// 真正會被送出的圖層：有範圍也有材質
function activeLayers(){
  return layers.filter(function(l){ return layerHasMask(l) && layerHasTarget(l); });
}

function refreshGo(){
  var go = $("go");
  if(!photo){
    go.disabled = true; go.textContent = "請先上傳現況照片";
    $("lock-note").innerHTML = "";
    return;
  }

  var ready   = activeLayers();
  var masked  = layers.filter(layerHasMask);
  var hasArea = !!areaText();
  var textMode = masked.length === 0;

  if(textMode){
    // 沒有任何圈選 -> 純文字模式，用第一個圖層的材質
    var ok = layerHasTarget(layers[0]) && hasArea;
    go.disabled = !ok;
    go.textContent = !layerHasTarget(layers[0]) ? "請選擇材質、輸入文字或上傳色板"
                   : !hasArea                   ? "請圈選範圍，或在「指定部位」寫要改哪裡"
                   : "開始模擬（依文字判斷範圍）";
  }else{
    go.disabled = ready.length === 0;
    go.textContent = ready.length === 0
      ? "圈選好的顏色還沒指定材質"
      : (ready.length > 1 ? "開始模擬（" + ready.length + " 種條件）" : "開始模擬");
  }

  // 有圈選才談得上鎖定
  var lock = $("lock");
  lock.disabled = textMode;

  var notes = [];
  if(textMode){
    notes.push('未圈選範圍時無法鎖定 — AI 會依「' + (hasArea ? areaText() : "文字") +
      '」自行判斷改哪裡，畫面其他地方有可能一併被調整。建議先用<b>「👆 點選」</b>或<b>「AI 自動框選」</b>把範圍框出來。');
  }else{
    var noMat = masked.filter(function(l){ return !layerHasTarget(l); })
                      .map(function(l){ return layerName(layers.indexOf(l)); });
    if(noMat.length) notes.push(noMat.join("、") + " 有圈選範圍但還沒指定材質，這次不會被套用。");
  }
  $("lock-note").innerHTML = notes.length
    ? '<div class="segmsg err" style="margin-top:6px">' + notes.join("<br>") + "</div>" : "";
}

// 每個圖層各自的標記色都畫上去
function buildMarked(list){
  var c = mkCanvas(photo.w, photo.h);
  var x = c.getContext("2d");
  x.drawImage(photo.canvas, 0, 0);

  list.forEach(function(l){
    var t = mkCanvas(photo.w, photo.h);
    var tx = t.getContext("2d");
    tx.drawImage(l.mask, 0, 0);
    tx.globalCompositeOperation = "source-in";
    tx.fillStyle = LAYER_COLORS[l.ci].hex;
    tx.fillRect(0, 0, photo.w, photo.h);
    x.globalAlpha = 0.55;
    x.drawImage(t, 0, 0);
    x.globalAlpha = 1;
  });
  return c;
}

// 所有要套用的圖層聯集，用來鎖定其餘區域
function unionMask(list){
  var c = mkCanvas(photo.w, photo.h);
  var x = c.getContext("2d");
  list.forEach(function(l){ x.drawImage(l.mask, 0, 0); });
  return c;
}

function colorWord(ci){
  var n = LAYER_COLORS[ci].name;
  return n.slice(-1) === "色" ? n : n + "色";
}

function layerWants(l, swatchNo){
  var wants = [];
  if(l.swatch) wants.push("以【圖" + swatchNo + " " + layerName(layers.indexOf(l)) + " 材質樣板】的顏色與紋理為準");
  if(l.picked) wants.push(l.picked.desc);
  var d = (l.desc || "").trim();
  if(d) wants.push(d);
  return wants.join("；");
}

function buildPrompt(list, swatchNos, hasMask){
  var area = areaText();
  var lines = [
    "你是室內裝修的照片級視覺化工具。請以【圖1 現況照片】為基底，輸出一張同尺寸、同視角、同構圖的寫實照片。",
    ""
  ];

  if(!hasMask){
    lines.push("任務：只把照片中「" + area + "」的部分（請自行判斷它的完整範圍與邊界），材質換成以下條件：" +
      layerWants(layers[0], 2) + "。");
  }else if(list.length === 1){
    lines.push("任務：只把【圖2 標記圖】中" + colorWord(list[0].ci) + "覆蓋到的區域" +
      (area ? "（該區域是：" + area + "）" : "") + "，材質換成以下條件：" + layerWants(list[0], swatchNos[0]) + "。");
  }else{
    lines.push("任務：【圖2 標記圖】上用不同顏色標出了 " + list.length + " 個區域，各自要換成不同的材質：");
    list.forEach(function(l, i){
      lines.push("- " + colorWord(l.ci) + "標記的區域 → " + layerWants(l, swatchNos[i]));
    });
    lines.push("每個顏色只套用它自己那一條，不要互相混用。");
  }

  lines.push(
    "",
    "必須遵守：",
    "1. 完整保留原照片的光影、明暗漸層、陰影、反光與強度，換材質後仍要符合現場光線。",
    "2. 保留原本的透視、板材分割線、縫隙、門片邊界與五金位置。",
    "3. 若為木紋，紋理方向順著原本板材的長邊延伸，紋理比例符合實際尺度。",
    hasMask
      ? "4. 標記區域以外的所有內容（牆面、地板、天花、家具、窗戶、燈具、人物）必須與原圖完全一致，不得更動。"
      : "4. 除了上述部位以外，其他所有內容（牆面、地板、天花、家具、窗戶、燈具、人物）必須與原圖完全一致，不得更動。",
    hasMask ? "5. 輸出畫面中不可出現任何標記顏色本身。" : "5. 邊界要貼合物件的真實輪廓，不可溢出到相鄰的面。",
    "6. 不要加入文字、浮水印、邊框或前後對比拼接。",
    "",
    "輸出：僅一張寫實的模擬照片。"
  );
  return lines.join("\n");
}

async function generate(){
  if(!API_KEY){ showKey(); return; }
  if($("go").disabled) return;

  var btn = $("go");
  btn.classList.add("busy");
  btn.disabled = true;
  setStatus('<span class="spin"></span><span>AI 模擬中，約需 10～30 秒…</span>');

  try{
    var list    = activeLayers();
    var hasMask = list.length > 0;
    var basePart = canvasToParts(photo.canvas, 0.94);

    var parts = [
      { text: "【圖1】現況照片：" },
      { inline_data: { mime_type: basePart.mime, data: basePart.b64 } }
    ];
    var no = 2;
    if(hasMask){
      var markedPart = canvasToParts(buildMarked(list), 0.94);
      parts.push({ text: "【圖2】標記圖，畫面上被標色的區域＝要更換材質的範圍：" });
      parts.push({ inline_data: { mime_type: markedPart.mime, data: markedPart.b64 } });
      no = 3;
    }

    var swatchNos = [];
    var srcList = hasMask ? list : [layers[0]];
    srcList.forEach(function(l){
      if(l.swatch){
        swatchNos.push(no);
        parts.push({ text: "【圖" + no + "】" + layerName(layers.indexOf(l)) + " 的材質樣板：" });
        parts.push({ inline_data: { mime_type: l.swatch.mime, data: l.swatch.b64 } });
        no++;
      }else{
        swatchNos.push(null);
      }
    });

    parts.push({ text: buildPrompt(list, swatchNos, hasMask) });

    var res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/" + $("model").value + ":generateContent",
      { method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": API_KEY },
        body: JSON.stringify({
          contents: [{ role: "user", parts: parts }],
          generationConfig: { responseModalities: ["IMAGE"] }
        }) }
    );

    var data = await res.json();
    if(data.error) throw new Error(data.error.message || "API 錯誤");

    var rparts = (data.candidates && data.candidates[0] && data.candidates[0].content &&
                  data.candidates[0].content.parts) || [];
    var imgPart = null;
    for(var i = 0; i < rparts.length; i++){
      var p = rparts[i].inlineData || rparts[i].inline_data;
      if(p && p.data){ imgPart = p; break; }
    }
    if(!imgPart){
      var why = (data.candidates && data.candidates[0] && data.candidates[0].finishReason) || "";
      throw new Error("模型沒有回傳圖片" + (why ? "（" + why + "）" : "") + "，請調整選取範圍或改用其他模型重試。");
    }

    var mime = imgPart.mimeType || imgPart.mime_type || "image/png";
    var aiImg = await new Promise(function(resolve, reject){
      var im = new Image();
      im.onload  = function(){ resolve(im); };
      im.onerror = function(){ reject(new Error("回傳圖片解析失敗")); };
      im.src = "data:" + mime + ";base64," + imgPart.data;
    });

    result = (hasMask && $("lock").checked)
      ? compositeWithMask(aiImg, unionMask(list))
      : fitToBase(aiImg);
    showResult();
    setStatus("");
  }catch(e){
    var m = e.message || "";
    var tip = "";
    if(/API key not valid|API_KEY_INVALID/i.test(m)){
      tip = '<br>→ 金鑰字串不對。點右上角「設定金鑰」，按<b>「測試金鑰」</b>看實際原因。';
    }else if(/limit:\s*0/i.test(m)){
      tip = '<br><b>→ 免費方案對影像模型的額度是 0，必須先開啟計費才能生成。</b>' +
            '<br>到 <a href="https://console.cloud.google.com/billing" target="_blank" rel="noopener">console.cloud.google.com/billing</a> 建立帳單帳戶並連結到金鑰所屬的專案。';
    }else if(/quota|RESOURCE_EXHAUSTED|rate limit/i.test(m)){
      tip = "<br>→ 短時間內請求太多，等 30～60 秒再按一次「開始模擬」。";
    }else if(/SERVICE_DISABLED|has not been used|PERMISSION_DENIED/i.test(m)){
      tip = "<br>→ 該專案尚未啟用 Generative Language API，錯誤訊息裡的連結可直接開啟啟用。";
    }
    setStatus("生成失敗：" + m + tip, "err");
  }finally{
    btn.classList.remove("busy");
    refreshGo();
  }
}

function fitToBase(aiImg){
  var c = mkCanvas(photo.w, photo.h);
  c.getContext("2d").drawImage(aiImg, 0, 0, photo.w, photo.h);
  return c;
}

function compositeWithMask(aiImg, m){
  var out = mkCanvas(photo.w, photo.h);
  var ox  = out.getContext("2d");
  ox.drawImage(photo.canvas, 0, 0);

  var layer = mkCanvas(photo.w, photo.h);
  var lx = layer.getContext("2d");
  lx.drawImage(aiImg, 0, 0, photo.w, photo.h);

  var soft = mkCanvas(photo.w, photo.h);
  var sx = soft.getContext("2d");
  var r = Math.max(1.5, Math.min(photo.w, photo.h) * 0.006);
  sx.filter = "blur(" + r.toFixed(1) + "px)";
  sx.drawImage(m, 0, 0);
  sx.filter = "none";

  lx.globalCompositeOperation = "destination-in";
  lx.drawImage(soft, 0, 0);

  ox.drawImage(layer, 0, 0);
  return out;
}

// ============================================================
// 結果
// ============================================================
function showResult(){
  var beforeUrl = photo.canvas.toDataURL("image/jpeg", 0.92);
  var afterUrl  = result.toDataURL("image/jpeg", 0.92);
  $("im-result").src = afterUrl;
  $("im-before").src = beforeUrl;
  $("im-after").src  = afterUrl;
  $("s4").classList.remove("hide");
  setView("after");
  setSplit(50);
  $("s4").scrollIntoView({ behavior: "smooth", block: "start" });
}

function setView(v){
  var isAfter = (v === "after");
  $("view-after").classList.toggle("hide", !isAfter);
  $("view-compare").classList.toggle("hide", isAfter);
  $("v-after").classList.toggle("on", isAfter);
  $("v-compare").classList.toggle("on", !isAfter);
}

function setSplit(pct){
  pct = Math.max(0, Math.min(100, pct));
  $("im-after").style.clipPath = "inset(0 0 0 " + pct + "%)";
  $("cbar").style.left = pct + "%";
}

(function bindCompare(){
  var cmp = $("view-compare");
  var dragging = false;
  function move(e){
    var r = cmp.getBoundingClientRect();
    setSplit(((e.clientX - r.left) / r.width) * 100);
  }
  cmp.addEventListener("pointerdown", function(e){
    dragging = true; cmp.setPointerCapture(e.pointerId); move(e);
  });
  cmp.addEventListener("pointermove", function(e){ if(dragging) move(e); });
  cmp.addEventListener("pointerup", function(e){
    dragging = false;
    try{ cmp.releasePointerCapture(e.pointerId); }catch(err){}
  });
})();

function download(){
  if(!result) return;
  var a = document.createElement("a");
  a.download = "施工模擬_" + new Date().toISOString().slice(0, 10) + ".jpg";
  a.href = result.toDataURL("image/jpeg", 0.95);
  a.click();
}

// ============================================================
// API Key
// ============================================================
function showKey(){
  if($("keymo")) return;
  var d = document.createElement("div");
  d.id = "keymo";
  d.innerHTML =
    '<div class="ov" onclick="closeKey()"></div>' +
    '<div class="mo">' +
      '<div class="mo-t">設定 Google Gemini API 金鑰</div>' +
      '<div class="mo-d">到 <b>aistudio.google.com/apikey</b> 申請，貼進來後先按「測試金鑰」確認。' +
      '金鑰只存在這台裝置的瀏覽器（localStorage），不會上傳到任何伺服器。</div>' +
      '<input id="keyin" type="text" placeholder="AIza..." autocomplete="off" ' +
        'spellcheck="false" autocapitalize="off" autocorrect="off" value="' + API_KEY + '">' +
      '<div class="keyinfo" id="keyinfo"></div>' +
      '<div class="mo-r">' +
        '<button class="mo-c" onclick="closeKey()">取消</button>' +
        '<button class="mo-c" onclick="testKey()">測試金鑰</button>' +
        '<button class="mo-s" onclick="saveKey()">儲存啟用</button>' +
      "</div>" +
    "</div>";
  document.body.appendChild(d);
  $("keyin").oninput = showKeyInfo;
  showKeyInfo();
}

function cleanKey(s){ return (s || "").replace(/\s+/g, ""); }

function showKeyInfo(){
  var el = $("keyinfo");
  if(!el) return;
  var raw = $("keyin").value;
  var v = cleanKey(raw);
  if(!v){ el.textContent = ""; el.className = "keyinfo"; return; }

  var msgs = ["長度 " + v.length + " 字元"];
  var bad = false;
  if(raw !== v) msgs.push("已自動清掉空白／換行");
  if(v.indexOf("AIza") !== 0){
    msgs.push("⚠ 金鑰應該以 AIza 開頭 — 你可能複製到金鑰的「名稱」而不是金鑰本身");
    bad = true;
  }else if(v.length < 35){
    msgs.push("⚠ 看起來太短，可能沒複製完整");
    bad = true;
  }
  el.textContent = msgs.join("　·　");
  el.className = "keyinfo" + (bad ? " warn" : "");
}

async function testKey(){
  var el = $("keyinfo");
  var v = cleanKey($("keyin").value);
  if(!v){ el.textContent = "請先貼上金鑰"; el.className = "keyinfo warn"; return; }
  el.textContent = "測試中…";
  el.className = "keyinfo";
  try{
    var res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1",
                          { headers: { "x-goog-api-key": v } });
    var data = await res.json();
    if(data.error){
      el.textContent = "✕ " + (data.error.status || res.status) + "：" + data.error.message;
      el.className = "keyinfo warn";
    }else{
      el.textContent = "✓ 金鑰有效，可以按「儲存啟用」";
      el.className = "keyinfo ok";
    }
  }catch(e){
    el.textContent = "✕ 連線失敗：" + e.message;
    el.className = "keyinfo warn";
  }
}

function closeKey(){
  var m = $("keymo");
  if(m) m.remove();
}

function saveKey(){
  var v = cleanKey($("keyin").value);
  API_KEY = v;
  if(v) localStorage.setItem("gemini_api_key", v);
  else   localStorage.removeItem("gemini_api_key");
  closeKey();
  paintKeyState();
}

function paintKeyState(){
  $("kdot").style.background = API_KEY ? "#4AB87A" : "#555";
  $("klabel").textContent    = API_KEY ? "金鑰已設定" : "設定金鑰";
}

// ============================================================
// 啟動
// ============================================================
bindDrop("d-photo",  "f-photo",  loadPhoto);
bindDrop("d-swatch", "f-swatch", loadSwatch);
$("sw-prev").onclick = function(){ $("f-swatch").click(); };
renderCats();
renderMats();
paintKeyState();
onBrush();
setMode("tap");
refreshGo();
</script>
