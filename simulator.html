<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三川工方｜施工前後模擬</title>
<style>
:root{
  --bg:#0D1117; --card:#1A2230; --card2:#1E2840;
  --border:#243040; --border2:#2E3D52;
  --gold:#C9A84C; --gold2:#E8C97A; --gold-bg:rgba(201,168,76,0.08);
  --text:#E8EDF5; --muted:#4A5E78; --muted2:#6A7E98;
  --green:#4AB87A; --red:#D05050;
  --font:'PingFang TC','Noto Sans TC','Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 180px}

/* ── header ── */
.hd{position:sticky;top:0;z-index:50;background:rgba(13,17,23,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);margin:0 -14px 16px;padding:12px 14px;
    display:flex;align-items:center;gap:10px}
.hd-t{font-size:15px;font-weight:800;color:var(--gold);letter-spacing:1px}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:7px}
.keybtn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border2);
        border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--text);font-size:11.5px;font-family:var(--font)}
.kdot{width:7px;height:7px;border-radius:50%;background:#555;flex-shrink:0}
select,input[type=text]{background:var(--card);border:1px solid var(--border2);border-radius:8px;
        color:var(--text);font-family:var(--font);font-size:11.5px;padding:7px 9px;outline:none}
select:focus,input[type=text]:focus{border-color:var(--gold)}

/* ── 上傳 ── */
.drop{border:1.5px dashed var(--border2);border-radius:14px;padding:44px 18px;text-align:center;
      cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-bg)}
.drop-i{font-size:34px;margin-bottom:8px;opacity:.75}
.drop-t{font-size:14px;font-weight:700}
.drop-s{font-size:11.5px;color:var(--muted2);margin-top:5px;line-height:1.7}

/* ── 圖片區 ── */
.stage{position:relative;border-radius:14px;overflow:hidden;background:#000;
       border:1px solid var(--border2);line-height:0;touch-action:none}
.stage canvas{width:100%;height:auto;display:block;touch-action:none}
.stage.pick canvas{cursor:crosshair}

.imgbar{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center}
.ib{background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:7px 11px;
    cursor:pointer;color:var(--muted2);font-size:11.5px;font-weight:600;font-family:var(--font);transition:all .15s}
.ib:hover:not(:disabled){border-color:var(--gold2);color:var(--gold2)}
.ib:disabled{opacity:.3;cursor:not-allowed}
.ib.on{background:var(--gold);border-color:var(--gold);color:#0D1117}
.ib-sp{margin-left:auto;font-size:11px;color:var(--muted)}

/* ── 對話紀錄 ── */
.thread{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.turn{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);
      border-radius:11px;padding:9px 11px}
.turn img{width:52px;height:52px;object-fit:cover;border-radius:7px;flex-shrink:0;border:1px solid var(--border2);cursor:pointer}
.turn-b{flex:1;min-width:0}
.turn-t{font-size:12.5px;line-height:1.55}
.turn-s{font-size:10.5px;color:var(--muted);margin-top:2px}
.turn-x{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;
        font-family:var(--font);padding:2px 4px;flex-shrink:0}
.turn-x:hover{color:var(--gold2)}

/* ── 輸入列（固定底部）── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(13,17,23,.97);
      backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:11px 14px 14px}
.dock-in{max-width:760px;margin:0 auto}
.askrow{display:flex;gap:8px;align-items:flex-end}
.ask{flex:1;background:var(--card);border:1px solid var(--border2);border-radius:12px;
     color:var(--text);font-family:var(--font);font-size:14px;padding:12px 13px;outline:none;
     resize:none;line-height:1.5;max-height:110px}
.ask:focus{border-color:var(--gold)}
.ask::placeholder{color:var(--muted)}
.send{width:46px;height:46px;border-radius:12px;background:var(--gold);border:none;cursor:pointer;
      color:#0D1117;font-size:19px;font-weight:800;flex-shrink:0;font-family:var(--font)}
.send:disabled{opacity:.35;cursor:not-allowed}
.qrow{display:flex;gap:6px;overflow-x:auto;margin-bottom:9px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.qrow::-webkit-scrollbar{display:none}
.q{flex-shrink:0;background:var(--card2);border:1px solid var(--border2);border-radius:15px;
   padding:5px 12px;cursor:pointer;color:var(--muted2);font-size:11.5px;font-family:var(--font);white-space:nowrap}
.q:hover{border-color:var(--gold);color:var(--gold2)}
.advtoggle{display:block;width:100%;background:none;border:none;color:var(--muted);font-size:11px;
           cursor:pointer;font-family:var(--font);margin-top:9px;text-align:center}
.advtoggle:hover{color:var(--gold2)}

/* ── 狀態列 ── */
.state{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:11px;
       background:var(--card2);font-size:12.5px;margin-top:12px;line-height:1.7}
.state.err{background:rgba(208,80,80,.1);color:#F0A0A0;display:block;word-break:break-word}
.state.ask{background:var(--gold-bg);border:1px solid var(--gold);display:block}
.state a{color:var(--gold2);text-decoration:underline}
.spin{width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--gold);
      border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.confirm-r{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.cbtn{background:var(--gold);border:1px solid var(--gold);border-radius:9px;padding:9px 14px;cursor:pointer;
      color:#0D1117;font-size:12.5px;font-weight:700;font-family:var(--font)}
.cbtn.alt{background:transparent;color:var(--muted2);border-color:var(--border2)}
.cbtn.alt:hover{border-color:var(--gold2);color:var(--gold2)}

.reglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.reg{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border2);
     border-radius:15px;padding:5px 11px;cursor:pointer;font-size:11.5px;font-family:var(--font);color:var(--muted2)}
.reg.on{border-color:var(--gold);color:var(--gold2)}
.reg .rd{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.reg.off .rd{opacity:.25}

/* ── 進階面板 ── */
.adv{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px}
.adv-t{font-size:12px;font-weight:700;color:var(--gold2);margin-bottom:10px}
.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.tbtn{background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:8px 11px;
      cursor:pointer;color:var(--text);font-size:11.5px;font-family:var(--font);font-weight:600}
.tbtn:hover{border-color:var(--gold2)}
.tbtn.on{background:var(--gold);border-color:var(--gold);color:#0D1117}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
.brush{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border2);
       border-radius:8px;padding:6px 11px;flex:1;min-width:170px}
.brush.off{opacity:.4}
.brush label{font-size:11px;color:var(--muted2);white-space:nowrap}
.brush input[type=range]{flex:1;accent-color:var(--gold);min-width:50px}
.brush .bv{font-size:11px;color:var(--gold);min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.adv-note{font-size:11px;color:var(--muted2);line-height:1.65;margin-top:8px}

.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;margin:12px 0 9px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;background:var(--card2);border:1px solid var(--border2);border-radius:16px;
     padding:6px 13px;cursor:pointer;color:var(--muted2);font-size:11.5px;font-weight:600;
     font-family:var(--font);white-space:nowrap}
.cat.on{background:var(--gold);border-color:var(--gold);color:#0D1117}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.mat{background:var(--card2);border:1.5px solid var(--border2);border-radius:9px;overflow:hidden;
     cursor:pointer;padding:0;font-family:var(--font);text-align:left}
.mat:hover{border-color:var(--gold2)}
.mat .sw{height:44px;width:100%;display:block}
.mat .nm{display:block;padding:5px 7px;font-size:11px;font-weight:600;color:var(--text);line-height:1.3}

/* ── 對比 ── */
.cmp{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border2);
     background:#000;line-height:0;touch-action:none;user-select:none}
.cmp img{width:100%;height:auto;display:block}
.cmp .after{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cmp-bar{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);pointer-events:none;
         box-shadow:0 0 10px rgba(201,168,76,.7)}
.cmp-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;
          border-radius:50%;background:var(--gold);border:2px solid #0D1117;display:flex;
          align-items:center;justify-content:center;color:#0D1117;font-size:13px;font-weight:800}
.cmp-tag{position:absolute;top:10px;padding:3px 9px;border-radius:6px;background:rgba(13,17,23,.8);
         font-size:10px;font-weight:700;letter-spacing:1px;line-height:1.8}
.cmp-tag.l{left:10px;color:var(--muted2)}
.cmp-tag.r{right:10px;color:var(--gold)}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:300;
       background:var(--card2);border:1px solid var(--gold);color:var(--gold2);
       border-radius:10px;padding:11px 16px;font-size:12.5px;max-width:88vw;text-align:center;
       box-shadow:0 6px 24px rgba(0,0,0,.5)}

/* ── modal ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200}
.mo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:201;width:min(420px,92vw);
    background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:22px}
.mo-t{font-size:15px;font-weight:800;color:var(--gold);margin-bottom:8px}
.mo-d{font-size:12px;color:var(--muted2);margin-bottom:14px;line-height:1.7}
.mo input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:9px;
          color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
          font-size:12px;padding:11px;outline:none}
.keyinfo{font-size:11.5px;color:var(--muted2);margin-top:9px;line-height:1.65;word-break:break-word;min-height:1px}
.keyinfo.warn{color:#F0A0A0}
.keyinfo.ok{color:var(--green)}
.mo-r{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mo-r button{flex:1;min-width:82px;border-radius:9px;padding:11px 8px;cursor:pointer;font-family:var(--font);
             font-size:13px;font-weight:700;border:1px solid var(--border2)}
.mo-c{background:transparent;color:var(--muted2)}
.mo-s{background:var(--gold);color:#0D1117;border-color:var(--gold)}


/* ── 色板庫 ── */
.libtabs{display:flex;gap:7px;margin-bottom:11px}
.libtab{flex:1;background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:8px;
        cursor:pointer;color:var(--muted2);font-size:12px;font-weight:700;font-family:var(--font)}
.libtab.on{background:var(--gold);border-color:var(--gold);color:#0D1117}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;
         max-height:44vh;overflow-y:auto}
.libit{position:relative;background:var(--card2);border:1.5px solid var(--border2);border-radius:9px;
       overflow:hidden;cursor:pointer;padding:0;font-family:var(--font);text-align:left}
.libit:hover{border-color:var(--gold2)}
.libit.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-bg)}
.libit .sw{height:62px;width:100%;display:block;object-fit:cover}
.libit .nm{display:block;padding:5px 7px;font-size:11px;font-weight:600;color:var(--text);
           line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libit .del{position:absolute;top:4px;right:4px;background:rgba(13,17,23,.85);border:none;
            border-radius:5px;color:#F0A0A0;font-size:11px;width:20px;height:20px;cursor:pointer;
            font-family:var(--font);line-height:1}
.libempty{grid-column:1/-1;text-align:center;color:var(--muted2);font-size:12px;padding:24px 8px;line-height:1.8}
.libup{border:1.5px dashed var(--border2);border-radius:9px;display:flex;flex-direction:column;
       align-items:center;justify-content:center;cursor:pointer;min-height:92px;color:var(--muted2);
       font-size:11.5px;font-family:var(--font);background:none}
.libup:hover{border-color:var(--gold);color:var(--gold2)}

/* 已選色板 chip */
.selsw{display:flex;align-items:center;gap:8px;background:var(--gold-bg);border:1px solid var(--gold);
       border-radius:9px;padding:6px 9px;margin-bottom:9px}
.selsw img{width:30px;height:30px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid var(--border2)}
.selsw .t{flex:1;min-width:0;font-size:11.5px;line-height:1.4}
.selsw .t b{color:var(--gold2)}
.selsw .t span{display:block;color:var(--muted2);font-size:10.5px}
.selsw button{background:none;border:none;color:var(--muted2);font-size:15px;cursor:pointer;
              font-family:var(--font);padding:2px 5px}

/* dock 動作列 */
.actrow{display:flex;gap:6px;margin-bottom:9px}
.act{flex:1;background:var(--card2);border:1px solid var(--border2);border-radius:9px;padding:8px 6px;
     cursor:pointer;color:var(--muted2);font-size:11.5px;font-weight:600;font-family:var(--font)}
.act:hover{border-color:var(--gold);color:var(--gold2)}
.act.on{background:var(--gold);border-color:var(--gold);color:#0D1117}

/* ── 模擬結果（含標註）── */
.results{margin-top:18px;display:flex;flex-direction:column;gap:16px}
.res-h{font-size:12.5px;font-weight:700;color:var(--gold2);margin-bottom:-4px}
.res{background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden}
.res-img{width:100%;height:auto;display:block;cursor:pointer;background:#000}
.res-tag{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--border)}
.res-sw{width:44px;height:44px;border-radius:8px;flex-shrink:0;border:1px solid var(--border2);object-fit:cover}
.res-tx{flex:1;min-width:0}
.res-nm{font-size:13px;font-weight:700;color:var(--gold2);line-height:1.4}
.res-ds{font-size:11px;color:var(--muted2);line-height:1.55;margin-top:1px}
.res-no{font-size:10.5px;color:var(--muted);margin-top:2px}
.res-bar{display:flex;gap:6px;padding:0 12px 11px;flex-wrap:wrap}
.res-b{background:var(--card2);border:1px solid var(--border2);border-radius:7px;padding:6px 10px;
       cursor:pointer;color:var(--muted2);font-size:11px;font-weight:600;font-family:var(--font)}
.res-b:hover{border-color:var(--gold2);color:var(--gold2)}

/* ── 配色建議 ── */
.sug{background:var(--card2);border:1px solid var(--border2);border-radius:11px;padding:11px;margin-bottom:9px}
.sug-t{font-size:13px;font-weight:700;color:var(--gold2)}
.sug-d{font-size:11.5px;color:var(--muted2);line-height:1.65;margin:3px 0 8px}
.sug-p{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border)}
.sug-a{font-size:11.5px;font-weight:700;min-width:52px;flex-shrink:0}
.sug-m{font-size:11.5px;color:var(--muted2);flex:1;min-width:0;line-height:1.5}
.sug-u{background:var(--gold);border:none;border-radius:7px;padding:5px 10px;cursor:pointer;
       color:#0D1117;font-size:11px;font-weight:700;font-family:var(--font);flex-shrink:0}

.hide{display:none !important}
</style>
</head>
<body>

<div class="wrap">

  <div class="hd">
    <div class="hd-t">三川工方</div>
    <div class="hd-r">
      <select id="model" title="生成模型">
        <option value="gemini-3-pro-image-preview">Pro（畫質最好）</option>
        <option value="gemini-3.1-flash-image-preview" selected>快速（便宜）</option>
      </select>
      <button class="keybtn" onclick="showKey()">
        <span class="kdot" id="kdot"></span><span id="klabel">金鑰</span>
      </button>
    </div>
  </div>

  <!-- 上傳 -->
  <input type="file" id="f-photo" accept="image/*" class="hide">
<input type="file" id="f-lib" accept="image/*" multiple class="hide">
  <div class="drop" id="d-photo">
    <div class="drop-i">📷</div>
    <div class="drop-t">上傳現況照片</div>
    <div class="drop-s">上傳後直接打一句話說要怎麼改<br>例：把系統櫃門片換成深胡桃木</div>
  </div>

  <!-- 主畫面 -->
  <div class="hide" id="main">
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>

    <div class="imgbar">
      <button class="ib" id="b-orig"  onclick="showOriginal()">原圖</button>
      <button class="ib" id="b-undo"  onclick="stepBack()" disabled>↶ 上一步</button>
      <button class="ib" id="b-cmp"   onclick="openCompare()" disabled>前後對比</button>
      <button class="ib" id="b-dl"    onclick="download()" disabled>⤓ 下載</button>
      <span class="ib-sp" id="counter"></span>
    </div>

    <div id="state"></div>
    <div id="sugbox"></div>
    <div class="results" id="results"></div>

    <!-- 進階（預設收起）-->
    <div class="adv hide" id="adv">
      <div class="adv-t">進階：自己圈選範圍</div>
      <div class="tools">
        <button class="tbtn" id="t-tap"     onclick="setMode('tap')">👆 點選</button>
        <button class="tbtn" id="t-paint"   onclick="setMode('paint')">🖌 塗抹</button>
        <button class="tbtn" id="t-rect"    onclick="setMode('rect')">▭ 方框</button>
        <button class="tbtn" id="t-ellipse" onclick="setMode('ellipse')">◯ 圓形</button>
        <button class="tbtn" id="t-line"    onclick="setMode('line')">📏 直線</button>
        <button class="tbtn" id="t-erase"   onclick="setMode('erase')">🧽 擦除</button>
      </div>
      <div class="tools">
        <button class="tbtn" onclick="setMode('off')">✕ 關閉圈選</button>
        <button class="tbtn" onclick="clearMask()">清除範圍</button>
        <div class="brush" id="brush-row">
          <label id="brush-label">筆刷粗細</label>
          <input type="range" id="bsize" min="8" max="200" value="52" oninput="onBrush()">
          <span class="bv" id="bval">52</span>
        </div>
      </div>
      <div class="adv-note" id="adv-note">自己圈好範圍後，下面直接打「換成 XXX」就只會改這一塊。</div>

      <div class="cats" id="cats"></div>
      <div class="mats" id="mats"></div>
      <div class="adv-note">點色票會把材質描述帶進下面的輸入框，可以再自己加字。</div>
    </div>
  </div>
</div>

<!-- 底部輸入列 -->
<div class="dock hide" id="dock">
  <div class="dock-in">
    <div id="selsw-box"></div>
    <div class="actrow">
      <button class="act" id="a-lib" onclick="openLib()">🎨 色板庫</button>
      <button class="act" onclick="askStyle()">💡 配色建議</button>
      <button class="act" id="advtoggle2" onclick="toggleAdv()">⚙ 進階</button>
    </div>
    <div class="qrow" id="qrow"></div>
    <div class="askrow">
      <textarea class="ask" id="ask" rows="1" placeholder="想怎麼改？例：把櫃體門片換成深胡桃木"
                oninput="growAsk()" onkeydown="askKey(event)"></textarea>
      <button class="send" id="send" onclick="submitAsk()">↑</button>
    </div>
  </div>
</div>

// ============================================================
// 小工具
// ============================================================
function $(id){ return document.getElementById(id); }

function mkCanvas(w,h){ var c=document.createElement("canvas"); c.width=w; c.height=h; return c; }

function cloneCanvas(src){
  var c = mkCanvas(src.width, src.height);
  c.getContext("2d").drawImage(src, 0, 0);
  return c;
}

function toast(msg){
  var old = document.querySelector(".toast");
  if(old) old.remove();
  var d = document.createElement("div");
  d.className = "toast"; d.innerHTML = msg;
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 3000);
}

function setState(html, kind){
  var el = $("state");
  if(!html){ el.innerHTML = ""; return; }
  el.innerHTML = '<div class="state' + (kind ? " " + kind : "") + '">' + html + "</div>";
}
function working(msg){ setState('<span class="spin"></span><span>' + msg + "</span>"); }

function fileToImage(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload  = function(){ res(im); };
      im.onerror = function(){ rej(new Error("圖片讀取失敗")); };
      im.src = fr.result;
    };
    fr.onerror = function(){ rej(new Error("檔案讀取失敗")); };
    fr.readAsDataURL(file);
  });
}

function jpegParts(canvas, q){
  var url = canvas.toDataURL("image/jpeg", q || 0.92);
  return { mime: "image/jpeg", b64: url.split(",")[1] };
}

function coverage(c){
  if(!c) return 0;
  var s = 120, t = mkCanvas(s, s), tx = t.getContext("2d");
  tx.drawImage(c, 0, 0, s, s);
  var d = tx.getImageData(0, 0, s, s).data, n = 0;
  for(var i = 3; i < d.length; i += 4){ if(d[i] > 12) n++; }
  return n / (s * s) * 100;
}
function hasMask(){ return coverage(mask) > 0.01; }

function hitCanvas(c, p){
  if(!c) return false;
  var x = Math.round(p.x), y = Math.round(p.y);
  if(x < 0 || y < 0 || x >= c.width || y >= c.height) return false;
  return c.getContext("2d").getImageData(x, y, 1, 1).data[3] > 40;
}

// ============================================================
// 載入照片
// ============================================================
async function loadPhoto(file){
  try{
    var im = await fileToImage(file);
    var sc = Math.min(1, MAX_EDGE / Math.max(im.width, im.height));
    var w = Math.round(im.width * sc), h = Math.round(im.height * sc);

    var base = mkCanvas(w, h);
    base.getContext("2d").drawImage(im, 0, 0, w, h);

    orig = { canvas: base, w: w, h: h };
    cur  = cloneCanvas(base);
    stack = []; turns = []; pending = null;
    mask = mkCanvas(w, h);
    undoMask = [];

    tintC = mkCanvas(w, h); tintX = tintC.getContext("2d");
    cv = $("cv"); cv.width = w; cv.height = h;
    ctx = cv.getContext("2d");
    bindCanvas();

    $("d-photo").classList.add("hide");
    $("main").classList.remove("hide");
    $("dock").classList.remove("hide");
    setMode("off");
    renderQuicks();
    renderThread();
    redraw();
    refreshBar();
    setState("");
    $("ask").focus();
  }catch(e){
    setState("照片載入失敗：" + e.message, "err");
  }
}

function resetAll(){
  orig = null; cur = null; stack = []; turns = []; pending = null; mask = null;
  $("d-photo").classList.remove("hide");
  $("main").classList.add("hide");

  setState("");
}

// ============================================================
// 畫面
// ============================================================
function redraw(preview){
  if(!cur || !ctx) return;
  ctx.clearRect(0, 0, orig.w, orig.h);
  ctx.drawImage(cur, 0, 0);

  function overlay(src, hex, alpha){
    tintX.clearRect(0, 0, orig.w, orig.h);
    tintX.drawImage(src, 0, 0);
    tintX.globalCompositeOperation = "source-in";
    tintX.fillStyle = hex;
    tintX.fillRect(0, 0, orig.w, orig.h);
    tintX.globalCompositeOperation = "source-over";
    ctx.globalAlpha = alpha;
    ctx.drawImage(tintC, 0, 0);
    ctx.globalAlpha = 1;
  }

  if(pending && pending.regions){
    var fs = Math.max(13, Math.round(orig.w * 0.026));
    pending.regions.forEach(function(r){
      if(!r.on) return;
      overlay(r.canvas, "#C9A84C", 0.5);
      ctx.font = "700 " + fs + "px sans-serif";
      var tw = ctx.measureText(r.label).width;
      var lx = Math.min(Math.max(4, r.x0), orig.w - tw - 16);
      var ly = Math.min(Math.max(4, r.y0), orig.h - fs - 12);
      ctx.fillStyle = "rgba(13,17,23,.82)";
      ctx.fillRect(lx, ly, tw + 14, fs + 10);
      ctx.fillStyle = "#E8C97A";
      ctx.fillText(r.label, lx + 7, ly + fs + 1);
    });
  }else if(hasMask()){
    overlay(mask, "#C9A84C", 0.45);
  }

  if(preview) preview(ctx);
}

function refreshBar(){
  $("b-undo").disabled = stack.length === 0;
  $("b-cmp").disabled  = turns.length === 0;
  $("b-dl").disabled   = turns.length === 0;
  $("counter").textContent = turns.length ? "已模擬 " + turns.length + " 次" : "";
  $("send").disabled = busy;
}

// 每一張模擬結果都帶著「用了哪個色板／材質」的標註，
// 顏色相近時才分得出來哪張是哪張。
function renderThread(){
  var el = $("results");
  if(!turns.length){ el.innerHTML = ""; return; }
  el.innerHTML = '<div class="res-h">模擬結果（共 ' + turns.length + " 張）</div>" +
    turns.map(function(t, i){
      var swHtml = t.swUrl
        ? '<img class="res-sw" src="' + t.swUrl + '">'
        : '<span class="res-sw" style="background:' + (t.swCss || "var(--card2)") + '"></span>';
      return '<div class="res">' +
        '<img class="res-img" src="' + t.url + '" onclick="revertTo(' + i + ')">' +
        '<div class="res-tag">' + swHtml +
          '<div class="res-tx">' +
            '<div class="res-nm">' + (t.swName || "自訂描述") + "</div>" +
            '<div class="res-ds">' + t.text + "</div>" +
            '<div class="res-no">第 ' + (i + 1) + " 張 · " + t.at + "</div>" +
          "</div></div>" +
        '<div class="res-bar">' +
          '<button class="res-b" onclick="downloadOne(' + i + ')">⤓ 下載（含標註）</button>' +
          '<button class="res-b" onclick="revertTo(' + i + ')">設為目前</button>' +
        "</div></div>";
    }).reverse().join("");
}

function revertTo(i){
  var im = new Image();
  im.onload = function(){
    stack.push(cloneCanvas(cur));
    var c = mkCanvas(orig.w, orig.h);
    c.getContext("2d").drawImage(im, 0, 0, orig.w, orig.h);
    cur = c;
    redraw(); refreshBar();
    toast("已設為目前這張（第 " + (i + 1) + " 張）");
  };
  im.src = turns[i].url;
}

// 把材質名稱與色板縮圖燒進圖片下緣，傳給業主時才不會弄混
function annotate(srcCanvas, t){
  return new Promise(function(resolve){
    var w = srcCanvas.width;
    var bar = Math.max(64, Math.round(w * 0.085));
    var out = mkCanvas(w, srcCanvas.height + bar);
    var x = out.getContext("2d");
    x.drawImage(srcCanvas, 0, 0);
    x.fillStyle = "#0D1117";
    x.fillRect(0, srcCanvas.height, w, bar);

    var pad = Math.round(bar * 0.18);
    var box = bar - pad * 2;
    var tx = pad;

    function text(){
      x.fillStyle = "#E8C97A";
      x.font = "700 " + Math.round(bar * 0.34) + "px sans-serif";
      x.fillText(t.swName || "自訂描述", tx, srcCanvas.height + pad + Math.round(bar * 0.34));
      x.fillStyle = "#6A7E98";
      x.font = "400 " + Math.round(bar * 0.24) + "px sans-serif";
      var d = t.text.length > 34 ? t.text.slice(0, 34) + "…" : t.text;
      x.fillText(d, tx, srcCanvas.height + pad + Math.round(bar * 0.68));
      resolve(out);
    }

    if(t.swUrl){
      var im = new Image();
      im.onload = function(){
        x.drawImage(im, pad, srcCanvas.height + pad, box, box);
        tx = pad * 2 + box;
        text();
      };
      im.onerror = function(){ text(); };
      im.src = t.swUrl;
    }else{
      text();
    }
  });
}

async function downloadOne(i){
  var t = turns[i];
  var im = await new Promise(function(res){
    var q = new Image(); q.onload = function(){ res(q); }; q.src = t.url;
  });
  var c = mkCanvas(im.width, im.height);
  c.getContext("2d").drawImage(im, 0, 0);
  var out = await annotate(c, t);
  var a = document.createElement("a");
  a.download = "施工模擬_" + (t.swName || "自訂") + "_" + (i + 1) + ".jpg";
  a.href = out.toDataURL("image/jpeg", 0.95);
  a.click();
}

  if(!orig) return;

// ============================================================
// 主流程：說一句話 -> 理解 + 框出範圍 -> 確認 -> 生成
// ============================================================
async function submitAsk(){
  if(busy) return;
  if(!API_KEY){ showKey(); return; }
  var text = $("ask").value.trim();
  if(!text && !sel){ toast("先打一句話說要怎麼改，或從色板庫選一個材質"); return; }
  if(!text) text = "換成這個材質";

  // 已經自己圈好範圍 -> 直接生成，不用再問 AI 要改哪裡
  if(hasMask()){
    pending = { text: text, area: "", material: text, regions: null };
    await runGenerate();
    return;
  }

  busy = true; refreshBar();
  working("正在理解你的需求並找出範圍…");
  try{
    var r = await understand(text);
    if(!r.regions.length){
      // 找不到明確範圍 -> 直接整張交給模型判斷
      pending = { text: text, area: r.area, material: r.material, regions: null };
      setState("找不到明確的範圍，這次會讓 AI 自己判斷要改哪裡。" +
        '<div class="confirm-r">' +
          '<button class="cbtn" onclick="runGenerate()">直接開始模擬</button>' +
          '<button class="cbtn alt" onclick="cancelPending();toggleAdv()">我自己圈</button>' +
        "</div>", "ask");
    }else{
      pending = { text: text, area: r.area, material: r.material, regions: r.regions };
      redraw();
      showConfirm();
    }
  }catch(e){
    setState(errText(e), "err");
  }finally{
    busy = false; refreshBar();
  }
}

function showConfirm(){
  var names = pending.regions.map(function(r, i){
    return '<span class="reg' + (r.on ? " on" : " off") + '" onclick="toggleReg(' + i + ')">' +
             '<span class="rd" style="background:#C9A84C"></span>' + r.label +
           "</span>";
  }).join("");
  setState(
    "圈出來的是 <b>" + (pending.area || "這些範圍") + "</b>，對嗎？（點標籤或畫面上的色塊可以開關）" +
    '<div class="reglist">' + names + "</div>" +
    '<div class="confirm-r">' +
      '<button class="cbtn" onclick="runGenerate()">對，開始模擬</button>' +
      '<button class="cbtn alt" onclick="cancelPending();toggleAdv()">不對，我自己圈</button>' +
      '<button class="cbtn alt" onclick="cancelPending()">取消</button>' +
    "</div>", "ask");
}

function toggleReg(i){
  pending.regions[i].on = !pending.regions[i].on;
  redraw(); showConfirm();
}

function cancelPending(){
  pending = null;
  redraw();
  setState("");
}

// 一次呼叫同時做：聽懂要改哪裡 + 要改成什麼 + 切出範圍
async function understand(text){
  var p = jpegParts(cur, 0.9);
  var prompt =
    "這是一張室內裝修的現場照片。使用者說：「" + text + "」\n\n" +
    "請做兩件事，並只輸出一個 JSON 物件：\n" +
    '1. "area"：使用者想改的部位，用繁體中文簡短描述（例：系統櫃門片）。若他沒指明部位就給空字串。\n' +
    '2. "material"：使用者想要的材質或效果，展開成具體的視覺描述（顏色、紋理、光澤、紋路方向）。\n' +
    '3. "regions"：照片中屬於該部位的區域陣列，每個項目包含：\n' +
    '   - "box_2d"：[ymin, xmin, ymax, xmax]，正規化到 0-1000\n' +
    '   - "mask"：該框內的分割遮罩，base64 PNG\n' +
    '   - "label"：繁體中文標籤\n\n' +
    "規則：\n" +
    "1. regions 要嚴格貼合物件的真實輪廓，不可把相鄰的牆面、地板、天花板或家具一起圈進來。\n" +
    "2. 同一類若有多塊分開的面（例如三片門片），一片一個項目分開列出並加編號。\n" +
    "3. 若使用者講的是整體性的調整（例如整體變亮），regions 回傳空陣列 []。\n" +
    "4. regions 最多 10 個。";

  var res = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/" + SEG_MODEL + ":generateContent",
    { method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": API_KEY },
      body: JSON.stringify({
        contents: [{ role: "user", parts: [
          { inline_data: { mime_type: p.mime, data: p.b64 } },
          { text: prompt }
        ]}],
        generationConfig: { responseMimeType: "application/json", thinkingConfig: { thinkingBudget: 0 } }
      }) }
  );
  var data = await res.json();
  if(data.error) throw new Error(data.error.message || "API 錯誤");

  var txt = "";
  var ps = (data.candidates && data.candidates[0] && data.candidates[0].content &&
            data.candidates[0].content.parts) || [];
  for(var i = 0; i < ps.length; i++){ if(ps[i].text) txt += ps[i].text; }

  var o = parseJson(txt) || {};
  var raw = Array.isArray(o.regions) ? o.regions : [];
  var regions = [];
  for(var j = 0; j < raw.length; j++){
    var reg = await regionFrom(raw[j], j);
    if(reg) regions.push(reg);
  }
  return { area: o.area || "", material: o.material || text, regions: regions };
}

function parseJson(txt){
  if(!txt) return null;
  var s = txt.replace(/```json|```/g, "").trim();
  try{ return JSON.parse(s); }catch(e){}
  var a = s.indexOf("{"), b = s.lastIndexOf("}");
  if(a >= 0 && b > a){ try{ return JSON.parse(s.slice(a, b + 1)); }catch(e2){} }
  return null;
}

function regionFrom(item, idx){
  return new Promise(function(resolve){
    if(!item || !item.box_2d || !item.mask){ resolve(null); return; }
    var b = item.box_2d;
    var y0 = Math.round(b[0] / 1000 * orig.h), x0 = Math.round(b[1] / 1000 * orig.w);
    var y1 = Math.round(b[2] / 1000 * orig.h), x1 = Math.round(b[3] / 1000 * orig.w);
    var bw = Math.max(1, x1 - x0), bh = Math.max(1, y1 - y0);
    if(bw < 2 || bh < 2){ resolve(null); return; }

    var src = String(item.mask);
    if(src.indexOf("data:") !== 0) src = "data:image/png;base64," + src;

    var im = new Image();
    im.onload = function(){
      var t = mkCanvas(bw, bh), tx = t.getContext("2d");
      tx.drawImage(im, 0, 0, bw, bh);
      // 機率圖 -> 二值 alpha（相容灰階不透明與 alpha 兩種編碼）
      var d = tx.getImageData(0, 0, bw, bh), p = d.data, on = 0;
      for(var i = 0; i < p.length; i += 4){
        var v = (p[i+3] < 250) ? p[i+3] : p[i];
        if(v > 127){ p[i] = p[i+1] = p[i+2] = 255; p[i+3] = 255; on++; }
        else p[i+3] = 0;
      }
      tx.putImageData(d, 0, 0);
      if(!on){ resolve(null); return; }
      var full = mkCanvas(orig.w, orig.h);
      full.getContext("2d").drawImage(t, x0, y0);
      resolve({ label: item.label || ("範圍 " + (idx+1)), canvas: full, on: true, x0: x0, y0: y0 });
    };
    im.onerror = function(){ resolve(null); };
    im.src = src;
  });
}

// ============================================================
// 生成
// ============================================================
function pendingMask(){
  if(!pending) return null;
  if(pending.regions){
    var chosen = pending.regions.filter(function(r){ return r.on; });
    if(!chosen.length) return null;
    var c = mkCanvas(orig.w, orig.h), x = c.getContext("2d");
    chosen.forEach(function(r){ x.drawImage(r.canvas, 0, 0); });
    return c;
  }
  return hasMask() ? mask : null;
}

function buildMarked(m){
  var c = mkCanvas(orig.w, orig.h), x = c.getContext("2d");
  x.drawImage(cur, 0, 0);
  var t = mkCanvas(orig.w, orig.h), tx = t.getContext("2d");
  tx.drawImage(m, 0, 0);
  tx.globalCompositeOperation = "source-in";
  tx.fillStyle = "#FF00E5";
  tx.fillRect(0, 0, orig.w, orig.h);
  x.globalAlpha = 0.55; x.drawImage(t, 0, 0); x.globalAlpha = 1;
  return c;
}

function buildPrompt(withMask){
  var want = pending.material || pending.text;
  if(sel){
    var swNo = withMask ? 3 : 2;
    want = sel.url
      ? "以【圖" + swNo + " 材質樣板】的顏色與紋理為準（樣板名稱：" + sel.name + "）" +
        (pending.text ? "，並符合這句需求：" + pending.text : "")
      : sel.desc + (pending.text && pending.text !== "換成這個材質" ? "，並符合：" + pending.text : "");
  }
  var area = pending.area;
  var target = withMask
    ? "【圖2 標記圖】中洋紅色覆蓋到的區域" + (area ? "（該區域是：" + area + "）" : "")
    : "照片中「" + (area || pending.text) + "」的部分（請自行判斷完整範圍與邊界）";

  return [
    "你是室內裝修的照片級視覺化工具。請以【圖1 現況照片】為基底，輸出一張同尺寸、同視角、同構圖的寫實照片。",
    "",
    "使用者的原話：「" + pending.text + "」",
    "任務：只把" + target + "改成：" + want + "。",
    "",
    "必須遵守：",
    "1. 完整保留原照片的光影、明暗漸層、陰影、反光與強度，換材質後仍要符合現場光線。",
    "2. 保留原本的透視、板材分割線、縫隙、門片邊界與五金位置。",
    "3. 若為木紋，紋理方向順著原本板材的長邊延伸，紋理比例符合實際尺度。",
    withMask
      ? "4. 標記區域以外的所有內容必須與原圖完全一致，不得更動。"
      : "4. 除了上述部位以外，其他所有內容必須與原圖完全一致，不得更動。",
    withMask ? "5. 輸出畫面中不可出現洋紅色標記本身。" : "5. 邊界要貼合物件的真實輪廓，不可溢出到相鄰的面。",
    "6. 不要加入文字、浮水印、邊框或前後對比拼接。",
    "",
    "輸出：僅一張寫實的模擬照片。"
  ].join("\n");
}

async function runGenerate(){
  if(busy || !pending) return;
  busy = true; refreshBar();
  working("模擬中，約需 10～30 秒…");

  try{
    var m = pendingMask();
    var withMask = !!m;
    var base = jpegParts(cur, 0.94);
    var parts = [
      { text: "【圖1】現況照片：" },
      { inline_data: { mime_type: base.mime, data: base.b64 } }
    ];
    if(withMask){
      var mk = jpegParts(buildMarked(m), 0.94);
      parts.push({ text: "【圖2】標記圖，洋紅色覆蓋處＝要更換的範圍：" });
      parts.push({ inline_data: { mime_type: mk.mime, data: mk.b64 } });
    }
    if(sel && sel.url){
      parts.push({ text: "【圖" + (withMask ? 3 : 2) + "】目標材質樣板（" + sel.name + "）：" });
      parts.push({ inline_data: { mime_type: "image/jpeg", data: sel.url.split(",")[1] } });
    }
    parts.push({ text: buildPrompt(withMask) });

    var res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/" + $("model").value + ":generateContent",
      { method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": API_KEY },
        body: JSON.stringify({
          contents: [{ role: "user", parts: parts }],
          generationConfig: { responseModalities: ["IMAGE"] }
        }) }
    );
    var data = await res.json();
    if(data.error) throw new Error(data.error.message || "API 錯誤");

    var rp = (data.candidates && data.candidates[0] && data.candidates[0].content &&
              data.candidates[0].content.parts) || [];
    var img = null;
    for(var i = 0; i < rp.length; i++){
      var q = rp[i].inlineData || rp[i].inline_data;
      if(q && q.data){ img = q; break; }
    }
    if(!img){
      var why = (data.candidates && data.candidates[0] && data.candidates[0].finishReason) || "";
      throw new Error("模型沒有回傳圖片" + (why ? "（" + why + "）" : "") + "，換句話說說看或縮小範圍再試。");
    }

    var aiImg = await new Promise(function(res2, rej){
      var im = new Image();
      im.onload = function(){ res2(im); };
      im.onerror = function(){ rej(new Error("回傳圖片解析失敗")); };
      im.src = "data:" + (img.mimeType || img.mime_type || "image/png") + ";base64," + img.data;
    });

    stack.push(cloneCanvas(cur));
    cur = withMask ? composite(aiImg, m) : fitToBase(aiImg);

    turns.push({
      text:   pending.text,
      url:    cur.toDataURL("image/jpeg", 0.85),
      swName: sel ? sel.name : "",
      swUrl:  sel ? sel.url : "",
      swCss:  sel ? sel.css : "",
      at:     new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" })
    });
    pending = null;
    mask = mkCanvas(orig.w, orig.h);   // 這一輪的範圍用完就清掉
    setMode("off");

    $("ask").value = ""; growAsk();
    renderThread(); redraw(); refreshBar();
    setState("");
    $("ask").placeholder = "還要再改什麼？例：顏色再深一點、地板換成淺橡木";
  }catch(e){
    setState(errText(e), "err");
  }finally{
    busy = false; refreshBar();
  }
}

function errText(e){
  var m = e.message || "";
  var tip = "";
  if(/API key not valid|API_KEY_INVALID/i.test(m)){
    tip = '<br>→ 金鑰不對。點右上角「金鑰」，按<b>「測試金鑰」</b>看原因。';
  }else if(/limit:\s*0/i.test(m)){
    tip = '<br><b>→ 免費方案對影像模型的額度是 0，要先開啟計費。</b>' +
          '<br>到 <a href="https://console.cloud.google.com/billing" target="_blank" rel="noopener">console.cloud.google.com/billing</a> 建立帳單帳戶並連結到金鑰所屬的專案。';
  }else if(/quota|RESOURCE_EXHAUSTED|rate limit/i.test(m)){
    tip = "<br>→ 短時間內請求太多，等 30～60 秒再試一次。";
  }else if(/SERVICE_DISABLED|has not been used|PERMISSION_DENIED/i.test(m)){
    tip = "<br>→ 該專案尚未啟用 Generative Language API。";
  }
  return "失敗：" + m + tip;
}

function fitToBase(aiImg){
  var c = mkCanvas(orig.w, orig.h);
  c.getContext("2d").drawImage(aiImg, 0, 0, orig.w, orig.h);
  return c;
}

function composite(aiImg, m){
  var out = mkCanvas(orig.w, orig.h), ox = out.getContext("2d");
  ox.drawImage(cur, 0, 0);
  var lay = mkCanvas(orig.w, orig.h), lx = lay.getContext("2d");
  lx.drawImage(aiImg, 0, 0, orig.w, orig.h);
  var soft = mkCanvas(orig.w, orig.h), sx = soft.getContext("2d");
  var r = Math.max(1.5, Math.min(orig.w, orig.h) * 0.006);
  sx.filter = "blur(" + r.toFixed(1) + "px)";
  sx.drawImage(m, 0, 0);
  sx.filter = "none";
  lx.globalCompositeOperation = "destination-in";
  lx.drawImage(soft, 0, 0);
  ox.drawImage(lay, 0, 0);
  return out;
}

// ============================================================
// 進階：手動圈選
// ============================================================
function setMode(m){
  mode = m;
  ["tap","paint","rect","ellipse","line","erase"].forEach(function(k){
    var b = $("t-" + k);
    if(b) b.classList.toggle("on", k === m);
  });
  $("stage").classList.toggle("pick", m !== "off");
  var usesBrush = (m === "paint" || m === "erase" || m === "line");
  $("brush-row").classList.toggle("off", !usesBrush);
  $("bsize").disabled = !usesBrush;
  $("brush-label").textContent = (m === "line") ? "線條粗細" : "筆刷粗細";
  $("adv-note").innerHTML = TOOL_HINT[m];
}

function onBrush(){ brush = parseInt($("bsize").value, 10); $("bval").textContent = brush; }

function pushUndo(){
  undoMask.push(cloneCanvas(mask));
  if(undoMask.length > 20) undoMask.shift();
}

function clearMask(){
  if(!orig) return;
  pushUndo();
  mask = mkCanvas(orig.w, orig.h);
  redraw();
}

function toPt(e){
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (orig.w / r.width),
           y: (e.clientY - r.top)  * (orig.h / r.height) };
}

function paintAt(p){
  var mx = mask.getContext("2d");
  mx.globalCompositeOperation = (mode === "erase") ? "destination-out" : "source-over";
  mx.strokeStyle = "#fff"; mx.fillStyle = "#fff";
  mx.lineCap = "round"; mx.lineJoin = "round"; mx.lineWidth = brush;
  if(lastPt){ mx.beginPath(); mx.moveTo(lastPt.x, lastPt.y); mx.lineTo(p.x, p.y); mx.stroke(); }
  else { mx.beginPath(); mx.arc(p.x, p.y, brush/2, 0, Math.PI*2); mx.fill(); }
  mx.globalCompositeOperation = "source-over";
  lastPt = p;
}

function shapePath(c, a, b){
  if(mode === "line"){ c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); }
  else if(mode === "rect"){
    c.beginPath(); c.rect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y));
  }else if(mode === "ellipse"){
    c.beginPath();
    c.ellipse((a.x+b.x)/2, (a.y+b.y)/2, Math.abs(b.x-a.x)/2, Math.abs(b.y-a.y)/2, 0, 0, Math.PI*2);
  }
}

function commitShape(a, b){
  var mx = mask.getContext("2d");
  mx.globalCompositeOperation = "source-over";
  mx.fillStyle = "#fff"; mx.strokeStyle = "#fff";
  mx.lineCap = "round"; mx.lineJoin = "round"; mx.lineWidth = brush;
  shapePath(mx, a, b);
  if(mode === "line") mx.stroke(); else mx.fill();
}

function previewShape(a, b){
  return function(c){
    c.save(); c.globalAlpha = .5;
    c.fillStyle = "#C9A84C"; c.strokeStyle = "#E8C97A";
    c.lineCap = "round"; c.lineJoin = "round";
    shapePath(c, a, b);
    if(mode === "line"){ c.lineWidth = brush; c.stroke(); }
    else{
      c.fill(); c.globalAlpha = 1;
      c.lineWidth = Math.max(2, orig.w * .003);
      c.setLineDash([orig.w * .012, orig.w * .008]);
      c.stroke();
    }
    c.restore();
  };
}

function bindCanvas(){
  cv.onpointerdown = function(e){
    if(mode === "off" && !pending) return;
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    drawing = true; moved = false; startPt = toPt(e); lastPt = null;
    if(pending && pending.regions) return;
    if(mode === "tap" || mode === "off") return;
    pushUndo();
    if(mode === "paint" || mode === "erase"){ paintAt(startPt); redraw(); }
    else redraw(previewShape(startPt, startPt));
  };
  cv.onpointermove = function(e){
    if(!drawing) return;
    e.preventDefault();
    var p = toPt(e);
    if(Math.abs(p.x - startPt.x) > 3 || Math.abs(p.y - startPt.y) > 3) moved = true;
    if(pending || mode === "tap" || mode === "off") return;
    if(mode === "paint" || mode === "erase"){ paintAt(p); redraw(); }
    else redraw(previewShape(startPt, p));
  };
  cv.onpointerup = cv.onpointercancel = function(e){
    if(!drawing) return;
    drawing = false;
    var p = toPt(e);
    try{ cv.releasePointerCapture(e.pointerId); }catch(err){}

    // 確認階段：點畫面上的色塊即開關該範圍
    if(pending && pending.regions && !moved){
      for(var i = pending.regions.length - 1; i >= 0; i--){
        if(hitCanvas(pending.regions[i].canvas, p)){ toggleReg(i); break; }
      }
    }else if(mode === "tap"){
      if(!moved) tapSelect(p);
    }else if(mode === "rect" || mode === "ellipse" || mode === "line"){
      commitShape(startPt, p); redraw();
    }
    lastPt = null; startPt = null;
  };
}

async function tapSelect(p){
  if(!API_KEY){ showKey(); return; }
  if(hitCanvas(mask, p)){
    toast("這個位置已經在選取範圍內了，用「擦除」可以修掉");
    return;
  }
  working("正在辨識你點的位置…");
  try{
    var px = (p.x / orig.w * 100).toFixed(1), py = (p.y / orig.h * 100).toFixed(1);
    var r = await understand("畫面上位於水平 " + px + "%、垂直 " + py +
      "% 那個點所在的那一個獨立表面或物件（例如單獨一片門片、一整面牆、地板）");
    if(!r.regions.length){ setState("這個位置抓不到明確的物件，改用「方框」手動框。", "err"); return; }
    pushUndo();
    var mx = mask.getContext("2d");
    mx.globalCompositeOperation = "source-over";
    mx.drawImage(r.regions[0].canvas, 0, 0);
    redraw();
    setState("已加入「" + r.regions[0].label + "」。下面直接打要換成什麼。");
  }catch(e){
    setState(errText(e), "err");
  }
}

function setCat(i){ curCat = i; renderCats(); renderMats(); }

// ============================================================
// 色板庫：內建材質（文字描述）＋ 自己上傳的實拍色板（參考影像）
// ============================================================
var LIB_KEY = "sim_swatches";
var myLib   = [];        // [{id,name,url}] 使用者上傳，url 為 dataURL
var sel     = null;      // 目前選用 {id,name,url?,css?,desc?}
var libTab  = "mine";

function loadLib(){
  try{ myLib = JSON.parse(localStorage.getItem(LIB_KEY) || "[]"); }
  catch(e){ myLib = []; }
}
function saveLib(){
  try{ localStorage.setItem(LIB_KEY, JSON.stringify(myLib)); }
  catch(e){ toast("色板存不下了，請先刪掉幾張舊的"); }
}

function openLib(){
  if($("libmo")) return;
  var d = document.createElement("div");
  d.id = "libmo";
  d.innerHTML =
    '<div class="ov" onclick="closeLib()"></div>' +
    '<div class="mo" style="width:min(560px,94vw)">' +
      '<div class="mo-t">色板庫</div>' +
      '<div class="libtabs">' +
        '<button class="libtab" id="lt-mine" onclick="setLibTab(\'mine\')">我的色板</button>' +
        '<button class="libtab" id="lt-builtin" onclick="setLibTab(\'builtin\')">內建材質</button>' +
      "</div>" +
      '<div id="libcats"></div>' +
      '<div class="libgrid" id="libgrid"></div>' +
      '<div class="mo-r"><button class="mo-c" onclick="closeLib()">關閉</button></div>' +
    "</div>";
  document.body.appendChild(d);
  setLibTab(libTab);
}
function closeLib(){ var m = $("libmo"); if(m) m.remove(); }

function setLibTab(t){
  libTab = t;
  $("lt-mine").classList.toggle("on", t === "mine");
  $("lt-builtin").classList.toggle("on", t === "builtin");
  renderLib();
}

function renderLib(){
  var cats = $("libcats"), grid = $("libgrid");
  if(libTab === "builtin"){
    cats.innerHTML = '<div class="cats">' + MATERIALS.map(function(g, i){
      return '<button class="cat' + (i === curCat ? " on" : "") +
             '" onclick="setCat(' + i + ');renderLib()">' + g.cat + "</button>";
    }).join("") + "</div>";
    grid.innerHTML = MATERIALS[curCat].items.map(function(m, j){
      var id = "builtin:" + curCat + ":" + j;
      return '<button class="libit' + (sel && sel.id === id ? " on" : "") +
             '" onclick="useMat(' + curCat + "," + j + ');closeLib()">' +
        '<span class="sw" style="background:' + m.css + '"></span>' +
        '<span class="nm">' + m.name + "</span></button>";
    }).join("");
  }else{
    cats.innerHTML = "";
    var up = '<button class="libup" onclick="document.getElementById(\'f-lib\').click()">' +
             "<div style=\"font-size:20px\">＋</div><div>上傳色板</div><div style=\"font-size:10px\">可一次多張</div></button>";
    if(!myLib.length){
      grid.innerHTML = up +
        '<div class="libempty">還沒有色板。<br>把型錄上業主選的顏色拍起來，<br>一次全部上傳，模擬時點一下就能用。</div>';
    }else{
      grid.innerHTML = up + myLib.map(function(m){
        return '<div class="libit' + (sel && sel.id === m.id ? " on" : "") +
               '" onclick="pickMine(\'' + m.id + '\');closeLib()">' +
          '<img class="sw" src="' + m.url + '">' +
          '<span class="nm">' + m.name + "</span>" +
          '<button class="del" onclick="event.stopPropagation();delMine(\'' + m.id + '\')">✕</button>' +
        "</div>";
      }).join("");
    }
  }
}

async function uploadLib(files){
  var n = 0;
  for(var i = 0; i < files.length; i++){
    try{
      var im = await fileToImage(files[i]);
      var sc = Math.min(1, 512 / Math.max(im.width, im.height));
      var c = mkCanvas(Math.round(im.width * sc), Math.round(im.height * sc));
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      myLib.push({
        id: "u" + Date.now() + "_" + i,
        name: (files[i].name || "色板").replace(/\.[^.]+$/, "").slice(0, 14) || ("色板 " + (myLib.length + 1)),
        url: c.toDataURL("image/jpeg", 0.82)
      });
      n++;
    }catch(e){}
  }
  saveLib();
  renderLib();
  if(n) toast("已加入 " + n + " 張色板，點名稱可以改名");
}

function pickMine(id){
  var m = myLib.filter(function(x){ return x.id === id; })[0];
  if(m) pickSwatch({ id: m.id, name: m.name, url: m.url });
}

function delMine(id){
  myLib = myLib.filter(function(x){ return x.id !== id; });
  if(sel && sel.id === id) clearSel();
  saveLib(); renderLib();
}

function pickSwatch(o){
  sel = o;
  renderSel();
  var el = $("ask");
  if(!el.value.trim()) el.value = "換成這個材質";
  growAsk(); el.focus();
  toast("已選「" + o.name + "」");
}

function clearSel(){ sel = null; renderSel(); }

function renderSel(){
  var box = $("selsw-box");
  if(!sel){ box.innerHTML = ""; $("a-lib").classList.remove("on"); return; }
  $("a-lib").classList.add("on");
  var img = sel.url
    ? '<img src="' + sel.url + '">'
    : '<span style="width:30px;height:30px;border-radius:6px;flex-shrink:0;background:' + sel.css + '"></span>';
  box.innerHTML = '<div class="selsw">' + img +
    '<div class="t"><b>' + sel.name + "</b>" +
    "<span>" + (sel.url ? "會把這張色板當成材質參考" : "會依這個材質的描述生成") + "</span></div>" +
    '<button onclick="clearSel()">✕</button></div>';
}

// ============================================================
// AI 配色與風格建議
// ============================================================
async function askStyle(){
  if(!cur){ toast("請先上傳現況照片"); return; }
  if(!API_KEY){ showKey(); return; }
  if(busy) return;

  var style = prompt("業主想要什麼風格？（可留空，讓 AI 自己看照片建議）\n例：北歐風、日式侘寂、飯店風、無印風", "");
  if(style === null) return;

  busy = true; refreshBar();
  working("正在看照片並想配色…");
  $("sugbox").innerHTML = "";
  try{
    var p = jpegParts(cur, 0.9);
    var ask = "這是一張室內裝修的現場照片。" +
      (style.trim() ? "業主想要的風格是「" + style.trim() + "」。" : "請依照現場的採光、格局與既有元素判斷適合的風格。") +
      "\n\n請提出 3 套完整的配色與材質搭配方案，只輸出 JSON 陣列，每個項目包含：\n" +
      '- "name"：方案名稱（繁體中文，6 字內）\n' +
      '- "desc"：一句話說明這套為什麼適合這個空間\n' +
      '- "parts"：陣列，每項包含 "area"（部位，例如牆面／地板／櫃體）與 ' +
      '"material"（具體材質描述，含顏色、紋理、光澤）\n\n' +
      "規則：只針對照片中真的看得到的部位提建議；每套 2～4 個部位；材質描述要具體到可以直接照著做。";

    var res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/" + SEG_MODEL + ":generateContent",
      { method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": API_KEY },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [
            { inline_data: { mime_type: p.mime, data: p.b64 } }, { text: ask }
          ]}],
          generationConfig: { responseMimeType: "application/json" }
        }) }
    );
    var data = await res.json();
    if(data.error) throw new Error(data.error.message || "API 錯誤");

    var txt = "";
    var ps = (data.candidates && data.candidates[0] && data.candidates[0].content &&
              data.candidates[0].content.parts) || [];
    for(var i = 0; i < ps.length; i++){ if(ps[i].text) txt += ps[i].text; }

    var arr = parseJsonArr(txt);
    if(!arr.length) throw new Error("沒有拿到建議，再按一次試試。");

    $("sugbox").innerHTML = arr.map(function(g){
      return '<div class="sug"><div class="sug-t">' + (g.name || "方案") + "</div>" +
        '<div class="sug-d">' + (g.desc || "") + "</div>" +
        (g.parts || []).map(function(pt){
          var one = "把" + pt.area + "換成 " + pt.material;
          return '<div class="sug-p">' +
            '<span class="sug-a">' + pt.area + "</span>" +
            '<span class="sug-m">' + pt.material + "</span>" +
            '<button class="sug-u" onclick="useSug(' + JSON.stringify(one).replace(/"/g, "&quot;") + ')">套用</button>' +
          "</div>";
        }).join("") + "</div>";
    }).join("");
    setState("點各部位的「套用」會把描述帶進下面的輸入框，一次做一個部位。");
  }catch(e){
    setState(errText(e), "err");
  }finally{
    busy = false; refreshBar();
  }
}

function useSug(text){
  clearSel();
  $("ask").value = text;
  growAsk();
  $("ask").focus();
  $("ask").scrollIntoView({ behavior: "smooth", block: "center" });
}

function parseJsonArr(txt){
  if(!txt) return [];
  var s2 = txt.replace(/```json|```/g, "").trim();
  var o;
  try{ o = JSON.parse(s2); }
  catch(e){
    var a = s2.indexOf("["), b = s2.lastIndexOf("]");
    if(a < 0 || b < a) return [];
    try{ o = JSON.parse(s2.slice(a, b + 1)); }catch(e2){ return []; }
  }
  return Array.isArray(o) ? o : [o];
}

// ============================================================
// API Key
// ============================================================
function showKey(){
  if($("keymo")) return;
  var d = document.createElement("div");
  d.id = "keymo";
  d.innerHTML =
    '<div class="ov" onclick="closeKey()"></div>' +
    '<div class="mo">' +
      '<div class="mo-t">設定 Google Gemini API 金鑰</div>' +
      '<div class="mo-d">到 <b>aistudio.google.com/apikey</b> 申請，貼進來後先按「測試金鑰」確認。' +
      '金鑰只存在這台裝置的瀏覽器，不會上傳到任何伺服器。</div>' +
      '<input id="keyin" type="text" placeholder="AIza..." autocomplete="off" ' +
        'spellcheck="false" autocapitalize="off" autocorrect="off" value="' + API_KEY + '">' +
      '<div class="keyinfo" id="keyinfo"></div>' +
      '<div class="mo-r">' +
        '<button class="mo-c" onclick="closeKey()">取消</button>' +
        '<button class="mo-c" onclick="testKey()">測試金鑰</button>' +
        '<button class="mo-s" onclick="saveKey()">儲存啟用</button>' +
      "</div></div>";
  document.body.appendChild(d);
  $("keyin").oninput = showKeyInfo;
  showKeyInfo();
}
function cleanKey(s){ return (s || "").replace(/\s+/g, ""); }
function showKeyInfo(){
  var el = $("keyinfo"); if(!el) return;
  var raw = $("keyin").value, v = cleanKey(raw);
  if(!v){ el.textContent = ""; el.className = "keyinfo"; return; }
  var msgs = ["長度 " + v.length + " 字元"], bad = false;
  if(raw !== v) msgs.push("已自動清掉空白／換行");
  if(v.indexOf("AIza") !== 0){ msgs.push("⚠ 金鑰應該以 AIza 開頭 — 你可能複製到金鑰的「名稱」"); bad = true; }
  else if(v.length < 35){ msgs.push("⚠ 看起來太短，可能沒複製完整"); bad = true; }
  el.textContent = msgs.join("　·　");
  el.className = "keyinfo" + (bad ? " warn" : "");
}
async function testKey(){
  var el = $("keyinfo"), v = cleanKey($("keyin").value);
  if(!v){ el.textContent = "請先貼上金鑰"; el.className = "keyinfo warn"; return; }
  el.textContent = "測試中…"; el.className = "keyinfo";
  try{
    var res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1",
                          { headers: { "x-goog-api-key": v } });
    var data = await res.json();
    if(data.error){
      el.textContent = "✕ " + (data.error.status || res.status) + "：" + data.error.message;
      el.className = "keyinfo warn";
    }else{
      el.textContent = "✓ 金鑰有效，可以按「儲存啟用」";
      el.className = "keyinfo ok";
    }
  }catch(e){ el.textContent = "✕ 連線失敗：" + e.message; el.className = "keyinfo warn"; }
}
function closeKey(){ var m = $("keymo"); if(m) m.remove(); }
function saveKey(){
  var v = cleanKey($("keyin").value);
  API_KEY = v;
  if(v) localStorage.setItem("gemini_api_key", v); else localStorage.removeItem("gemini_api_key");
  closeKey(); paintKeyState();
}
function paintKeyState(){
  $("kdot").style.background = API_KEY ? "#4AB87A" : "#555";
  $("klabel").textContent    = API_KEY ? "已設定" : "金鑰";
}

// ============================================================
// 啟動
// ============================================================
(function bindDrop(){
  var drop = $("d-photo"), input = $("f-photo");
  drop.onclick = function(){ input.click(); };
  input.onchange = function(){ if(input.files[0]) loadPhoto(input.files[0]); input.value = ""; };
  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function(e){
    var f = e.dataTransfer.files[0];
    if(f && f.type.indexOf("image/") === 0) loadPhoto(f);
  });
})();

loadLib();
$("f-lib").onchange = function(){
  // FileList 是即時清單，清空 input 會連帶清掉它；
  // 非同步讀檔前先複製成陣列。
  var fs = Array.prototype.slice.call(this.files || []);
  this.value = "";
  if(fs.length) uploadLib(fs);
};
