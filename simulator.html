<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>三川工方｜施工模擬</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="施工模擬">
<meta name="theme-color" content="#FAF9F7">
<style>
:root{
  --bg:#FAF9F7; --card:#FFFFFF; --line:#EAE7E1; --line2:#DAD5CC;
  --ink:#1F1E1C; --muted:#6E6A62; --faint:#A6A199;
  --brand:#8C6A2B; --brand2:#A8823A; --brandbg:#F6F1E6;
  --shade:#F1EEE9; --red:#B4442F; --green:#3F8F5B;
  --sans:'PingFang TC','Noto Sans TC','Helvetica Neue',-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(31,30,28,.04), 0 2px 10px rgba(31,30,28,.05);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
     -webkit-font-smoothing:antialiased}

/* ── 頁首 ── */
.top{position:sticky;top:0;z-index:40;background:rgba(250,249,247,.86);
     backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:12px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#B08A3C,#7C5D22);
      display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
      box-shadow:0 1px 3px rgba(31,30,28,.18)}
.brandname{font-size:15px;font-weight:700;letter-spacing:.3px;line-height:1.3}
.brandsub{font-size:10px;color:var(--faint);letter-spacing:1.2px;line-height:1.3}
.keybtn{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--card);
        border:1px solid var(--line2);border-radius:999px;padding:7px 13px;cursor:pointer;
        color:var(--muted);font-size:12px;font-family:var(--sans);font-weight:600}
.keybtn:active{background:var(--shade)}
.kdot{width:7px;height:7px;border-radius:50%;background:#C6CEDC}

/* ── 對話 ── */
.thread{max-width:720px;margin:0 auto;padding:20px 18px 8px;
        min-height:calc(100vh - 260px)}

.hello{text-align:center;padding:16vh 24px 40px}
.hello-i{width:66px;height:66px;border-radius:21px;background:var(--card);border:1px solid var(--line);
         display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
         color:var(--brand);box-shadow:var(--shadow)}
.hello-t{font-size:20px;font-weight:650;letter-spacing:.4px}
.hello-d{font-size:13.5px;color:var(--faint);margin-top:10px;line-height:2}
.setup{display:inline-block;margin-top:26px;background:var(--card);border:1px solid var(--line);
        border-radius:15px;padding:16px 20px;font-size:13px;color:var(--ink);font-weight:600;
        box-shadow:var(--shadow)}
.setup-s{font-size:11.5px;color:var(--faint);font-weight:400;line-height:1.7;margin-top:5px}
.setup-b{display:block;width:100%;margin-top:13px;background:var(--ink);border:none;border-radius:11px;
         padding:11px 18px;cursor:pointer;color:#F7F5F2;font-size:13px;font-weight:650;font-family:var(--sans)}

.turn{margin-bottom:26px}

/* 使用者 */
.me{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.me-imgs{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:88%}
.me-img{position:relative;width:92px;height:92px;border-radius:14px;overflow:hidden;
        border:1px solid var(--line);box-shadow:var(--shadow)}
.me-img img{width:100%;height:100%;object-fit:cover;display:block}
.me-img span{position:absolute;left:6px;top:6px;background:rgba(31,30,28,.62);color:#fff;
             font-size:10px;font-weight:600;padding:2.5px 7px;border-radius:7px;
             letter-spacing:.5px;backdrop-filter:blur(4px)}
.me-txt{background:var(--ink);color:#F7F5F2;border-radius:18px 18px 6px 18px;padding:11px 16px;
        font-size:14.5px;max-width:86%;word-break:break-word;line-height:1.65;letter-spacing:.2px}

/* AI */
.ai{margin-top:14px}
.ai-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
         box-shadow:var(--shadow)}
.ai-card img{width:100%;display:block;background:var(--shade);cursor:zoom-in}
.ai-bar{display:flex;padding:4px;border-top:1px solid var(--line)}
.ab{flex:1;background:none;border:none;border-radius:11px;padding:11px 4px;cursor:pointer;
    color:var(--muted);font-size:12.5px;font-weight:600;font-family:var(--sans);letter-spacing:.2px}
.ab+.ab{box-shadow:inset 1px 0 0 var(--line)}
.ab:active{background:var(--shade);color:var(--brand);box-shadow:none}
.ai-note{font-size:11.5px;color:var(--faint);margin-top:9px;padding-left:4px;letter-spacing:.2px}

.working{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
         border-radius:15px;padding:14px 16px;font-size:13.5px;color:var(--muted);box-shadow:var(--shadow)}
.spin{width:17px;height:17px;border:2px solid var(--line2);border-top-color:var(--brand2);
      border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#FDF1EF;border:1px solid #F1CDC6;color:#8E2A1D;border-radius:15px;padding:14px 16px;
     font-size:13px;line-height:1.8;word-break:break-word}
.err a{color:#8E2A1D}
.err .fix{display:inline-block;margin-top:10px;background:var(--brand);border:none;border-radius:9px;
          padding:9px 15px;cursor:pointer;color:#fff;font-size:12.5px;font-weight:700;font-family:var(--sans)}

/* ── 輸入區 ── */
.dock{position:sticky;bottom:0;z-index:30;background:linear-gradient(to bottom,rgba(250,249,247,0),var(--bg) 20%);
      padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:720px;margin:0 auto;padding:0 18px}
.composer{background:var(--card);border:1px solid var(--line2);border-radius:24px;padding:8px;
          box-shadow:0 1px 3px rgba(31,30,28,.05), 0 8px 24px rgba(31,30,28,.06)}
.composer:focus-within{border-color:var(--line2);box-shadow:0 1px 3px rgba(31,30,28,.05),0 10px 28px rgba(31,30,28,.09)}

.att{display:flex;gap:7px;flex-wrap:wrap;padding:4px 4px 9px}
.att-i{position:relative;width:60px;height:60px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.att-i img{width:100%;height:100%;object-fit:cover;display:block}
.att-i .no{position:absolute;left:4px;top:4px;background:rgba(31,30,28,.66);color:#fff;font-size:9.5px;
           font-weight:700;padding:2px 6px;border-radius:5px}
.att-i .x{position:absolute;right:3px;top:3px;width:19px;height:19px;border-radius:50%;border:none;
          background:rgba(31,30,28,.62);color:#fff;cursor:pointer;padding:0;
          display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.att-i .mk{position:absolute;left:0;right:0;bottom:0;background:rgba(140,106,43,.92);color:#fff;
           font-size:9.5px;font-weight:700;text-align:center;padding:2px}

.cline{display:flex;align-items:flex-end;gap:8px}
.plus{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:none;background:var(--shade);
      cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.plus:active{background:var(--brandbg);color:var(--brand)}
.ask{flex:1;min-width:0;border:none;outline:none;background:none;font-family:var(--sans);
     font-size:16px;line-height:1.55;padding:8px 4px;resize:none;max-height:132px;color:var(--ink)}
.ask::placeholder{color:var(--faint)}
.send{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:none;background:var(--ink);
      cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;
      transition:background .15s}
.send:disabled{background:var(--line2);cursor:not-allowed}
.send:disabled svg{opacity:.7}
.hint{font-size:11px;color:var(--faint);text-align:center;margin-top:10px;line-height:1.6;min-height:1px}

/* ── 標記 ── */
.marker{position:fixed;inset:0;z-index:300;background:#0F131A;display:flex;flex-direction:column}
.mk-top{display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;flex-shrink:0}
.mk-top b{font-size:14px;font-weight:700}
.mk-top .sub{font-size:11.5px;color:#93A0B4}
.mk-x{margin-left:auto;background:none;border:none;color:#93A0B4;font-size:23px;cursor:pointer;
      font-family:var(--sans);line-height:1;padding:0 4px}
.mk-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 8px}
.mk-stage canvas{max-width:100%;max-height:100%;touch-action:none;border-radius:10px}
.mk-bot{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:9px;
        align-items:center;flex-shrink:0}
.mk-b{background:#212936;border:1px solid #313C4D;border-radius:11px;padding:11px 15px;cursor:pointer;
      color:#D7DEE9;font-size:13px;font-weight:650;font-family:var(--sans)}
.mk-b.on{background:#B8912E;border-color:#B8912E;color:#1B1400}
.mk-done{margin-left:auto;background:#B8912E;border:none;border-radius:11px;padding:12px 20px;
         cursor:pointer;color:#1B1400;font-size:14px;font-weight:800;font-family:var(--sans)}

/* ── 燈箱 ── */
.box{position:fixed;inset:0;z-index:280;background:rgba(15,19,26,.94);display:flex;
     align-items:center;justify-content:center;padding:16px}
.box img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.box .bx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:none;
         border:none;color:#93A0B4;font-size:26px;cursor:pointer;font-family:var(--sans)}

/* ── 對話框 ── */
.ov{position:fixed;inset:0;background:rgba(31,30,28,.42);z-index:200}
.mo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:201;width:min(400px,92vw);
    background:var(--card);border-radius:19px;padding:24px;box-shadow:0 18px 44px rgba(31,30,28,.18)}
.mo-t{font-size:16.5px;font-weight:750;margin-bottom:9px}
.mo-d{font-size:12.5px;color:var(--muted);margin-bottom:15px;line-height:1.8}
.mo input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:11px;
          color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:12.5px;padding:12px;outline:none}
.mo input:focus{border-color:var(--brand2)}
.kinfo{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.65;word-break:break-word;min-height:1px}
.kinfo.bad{color:var(--red)}
.kinfo.ok{color:var(--green)}
.mo-r{display:flex;gap:8px;margin-top:16px}
.mo-r button{flex:1;border-radius:11px;padding:12px 6px;cursor:pointer;font-family:var(--sans);
             font-size:13px;font-weight:700;border:1px solid var(--line2);background:transparent;color:var(--muted)}
.mo-r .main{background:var(--ink);color:#fff;border-color:var(--ink)}
.hide{display:none !important}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="logo"><svg viewBox="0 0 24 24" width="17" height="17" fill="none"
     stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
     <path d="M5 5v14M12 3v18M19 7v10"/></svg></div>
    <div>
      <div class="brandname">施工模擬</div>
      <div class="brandsub">SANCHUAN VISUALISER</div>
    </div>
    <button class="keybtn" onclick="showKey()">
      <span class="kdot" id="kdot"></span>金鑰
    </button>
  </div>
</div>

<div class="thread" id="thread"></div>

<div class="dock">
  <div class="dock-in">
    <div class="composer">
      <div class="att" id="att"></div>
      <div class="cline">
        <input type="file" id="f" accept="image/*" multiple class="hide">
        <button class="plus" onclick="document.getElementById('f').click()" title="加照片">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
        <textarea class="ask" id="ask" rows="1" placeholder="輸入訊息"></textarea>
        <button class="send" id="send" onclick="send()" title="送出">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<script>
"use strict";

var BUILD    = "08/12 09:34";
var API_KEY  = localStorage.getItem("gemini_api_key") || "";
var MAX_EDGE = 1408;

var atts    = [];   // 這一則要送出的圖 [{url,b64,marked}]
var turns   = [];   // 畫面上的對話
var convo   = [];   // 送給 API 的上下文
var busy    = false;

function $(id){ return document.getElementById(id); }
function esc(s){ return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ── 讀圖 ──
function readImage(file, maxEdge){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var sc = Math.min(1, maxEdge / Math.max(im.width, im.height));
        var c = document.createElement("canvas");
        c.width  = Math.round(im.width  * sc);
        c.height = Math.round(im.height * sc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        var url = c.toDataURL("image/jpeg", 0.92);
        resolve({ url: url, b64: url.split(",")[1] });
      };
      im.onerror = function(){ reject(new Error("圖片讀取失敗")); };
      im.src = fr.result;
    };
    fr.onerror = function(){ reject(new Error("檔案讀取失敗")); };
    fr.readAsDataURL(file);
  });
}

$("f").onchange = async function(){
  var fs = Array.prototype.slice.call(this.files || []);
  this.value = "";
  for(var i = 0; i < fs.length; i++){
    if(atts.length >= 6){ break; }
    try{ atts.push(await readImage(fs[i], MAX_EDGE)); }catch(e){}
  }
  renderAtt(); refreshSend();
};

function renderAtt(){
  $("att").innerHTML = atts.map(function(a, i){
    return '<div class="att-i">' +
      '<img src="' + a.url + '" onclick="markImage(' + i + ')">' +
      '<span class="no">圖' + (i + 1) + "</span>" +
      '<button class="x" onclick="dropAtt(' + i + ')"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      (a.marked ? '<span class="mk">已標記</span>' : "") +
    "</div>";
  }).join("");
}

function dropAtt(i){ atts.splice(i, 1); renderAtt(); refreshSend(); }

function refreshSend(){
  $("send").disabled = busy || (!$("ask").value.trim() && !atts.length);
  $("hint").textContent = atts.length ? "點縮圖可在上面標記要改的地方" : "";
}

$("ask").oninput = function(){
  this.style.height = "auto";
  this.style.height = Math.min(132, this.scrollHeight) + "px";
  refreshSend();
};

// ── 對話 ──
function renderThread(){
  if(!turns.length){
    $("thread").innerHTML =
      '<div class="hello"><div class="hello-i">' +
        '<svg viewBox="0 0 40 40" width="30" height="30" fill="none" stroke="currentColor" ' +
        'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M4 32V13l16-9 16 9v19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>' +
        '<path d="M15 34V21h10v13"/><path d="M20 4v9"/></svg></div>' +
      '<div class="hello-t">加照片，說一句話</div>' +
      '<div class="hello-d">可以一次加現況照與色板照<br>再用「圖1」「圖2」指定</div>' +
      (API_KEY ? "" :
        '<div class="setup">這台裝置還沒設定金鑰' +
        '<div class="setup-s">從主畫面捷徑開啟時，資料與 Safari 是分開的，要各自設定一次</div>' +
        '<button class="setup-b" onclick="showKey()">設定金鑰</button></div>') +
      "</div>";
    return;
  }
  $("thread").innerHTML = turns.map(function(t, i){
    if(t.role === "me"){
      return '<div class="turn"><div class="me">' +
        (t.imgs && t.imgs.length
          ? '<div class="me-imgs">' + t.imgs.map(function(u, j){
              return '<div class="me-img"><img src="' + u + '" onclick="lightbox(\'' + j + '_' + i + '\')">' +
                     "<span>圖" + (j + 1) + "</span></div>";
            }).join("") + "</div>"
          : "") +
        (t.text ? '<div class="me-txt">' + esc(t.text) + "</div>" : "") +
      "</div></div>";
    }
    if(t.role === "ai"){
      return '<div class="turn"><div class="ai"><div class="ai-card">' +
        '<img src="' + t.url + '" onclick="lightbox(\'ai' + i + '\')">' +
        '<div class="ai-bar">' +
          '<button class="ab" onclick="markResult(' + i + ')">標記再改</button>' +
          '<button class="ab" onclick="useAsBase(' + i + ')">接著改這張</button>' +
          '<button class="ab" onclick="shareTurn(' + i + ')">分享</button>' +
        "</div></div>" +
        (t.note ? '<div class="ai-note">' + esc(t.note) + "</div>" : "") +
      "</div></div>";
    }
    if(t.role === "busy")
      return '<div class="turn"><div class="working"><span class="spin"></span>' + esc(t.text) + "</div></div>";
    return '<div class="turn"><div class="err">' + t.html + "</div></div>";
  }).join("");
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

function lightbox(key){
  var url = "";
  var m = String(key).match(/^ai(\d+)$/);
  if(m) url = turns[+m[1]].url;
  else { var p = String(key).split("_"); url = turns[+p[1]].imgs[+p[0]]; }
  var d = document.createElement("div");
  d.className = "box";
  d.innerHTML = '<button class="bx">✕</button><img src="' + url + '">';
  d.onclick = function(){ d.remove(); };
  document.body.appendChild(d);
}

// ── 模型 ──
var MODEL_KEY = "sim_img_model";
var imgModel = localStorage.getItem(MODEL_KEY) || "";

async function pickModel(force){
  if(imgModel && !force) return imgModel;
  var r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",
                      { headers: { "x-goog-api-key": API_KEY } });
  var d = await r.json();
  if(d.error) throw new Error(d.error.message);
  var best = null, bs = -1;
  (d.models || []).forEach(function(m){
    var n = String(m.name).replace(/^models\//, "");
    var meth = m.supportedGenerationMethods || m.supported_generation_methods || [];
    if(meth.indexOf("generateContent") < 0) return;
    if(!/gemini/i.test(n) || !/image/i.test(n) || /imagen|veo/i.test(n)) return;
    var v = parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/i) || [0, 0])[1]) || 0;
    var sc = v * 100 + (/flash/i.test(n) ? 20 : 0);
    if(sc > bs){ bs = sc; best = n; }
  });
  if(!best) throw new Error("這把金鑰沒有可用的影像模型。");
  imgModel = best;
  localStorage.setItem(MODEL_KEY, best);
  return best;
}

var SYSTEM =
  "你是室內裝修的照片級視覺化工具，服務對象是工班師傅與他的業主。\n" +
  "使用者會給你現場照片，有時再附上建材型錄或色板的照片，並用「圖1」「圖2」指涉它們。\n" +
  "請照他的話修改現場照片，輸出一張同尺寸、同視角、同構圖的寫實照片。\n\n" +
  "規則：\n" +
  "1. 完整保留原照片的光影、明暗、陰影與反光，換材質後仍要符合現場光線。\n" +
  "2. 保留原本的透視、板材分割線、縫隙、門片邊界與五金位置。\n" +
  "3. 若為木紋，紋理方向順著原本板材的長邊延伸，比例符合實際尺度。\n" +
  "4. 只改他指定的部位，其餘所有內容與原圖完全一致。\n" +
  "5. 邊界貼合物件的真實輪廓，不可溢出到相鄰的面。\n" +
  "6. 若照片上有半透明的螢光色塗抹，那是使用者標出來要改的範圍：只改那塊，" +
  "且輸出畫面中不可出現那個螢光色本身。\n" +
  "7. 不要加入文字、浮水印或邊框。輸出僅一張寫實照片。";

async function send(){
  if(busy) return;
  if(!API_KEY){ showKey(); return; }
  var text = $("ask").value.trim();
  if(!text && !atts.length) return;

  var mine = { role: "me", text: text, imgs: atts.map(function(a){ return a.url; }) };
  turns.push(mine);

  var parts = [];
  atts.forEach(function(a, i){
    parts.push({ text: "【圖" + (i + 1) + "】" + (a.marked ? "（螢光色塗抹處＝要改的範圍）" : "") + "：" });
    parts.push({ inline_data: { mime_type: "image/jpeg", data: a.b64 } });
  });
  parts.push({ text: text || "照上面的圖做。" });

  var sentAtts = atts.slice();
  atts = []; renderAtt();
  $("ask").value = ""; $("ask").style.height = "auto";

  busy = true; refreshSend();
  turns.push({ role: "busy", text: "模擬中，約 10～30 秒…" });
  renderThread();

  try{
    var model = await pickModel(false);
    var contents = convo.slice(-10).concat([{ role: "user", parts: parts }]);
    var body = {
      contents: contents,
      systemInstruction: { parts: [{ text: SYSTEM }] },
      generationConfig: { responseModalities: ["IMAGE"] }
    };

    var data = null;
    for(var att = 0; att < 2; att++){
      var res = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
        { method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": API_KEY },
          body: JSON.stringify(body) });
      data = await res.json();
      if(!data.error) break;
      if(att === 0 && /no longer available|not found|NOT_FOUND|does not exist/i.test(data.error.message)){
        model = await pickModel(true);
        continue;
      }
      throw new Error(data.error.message);
    }

    var ps = (data.candidates && data.candidates[0] && data.candidates[0].content &&
              data.candidates[0].content.parts) || [];
    var img = null;
    for(var i = 0; i < ps.length; i++){
      var q = ps[i].inlineData || ps[i].inline_data;
      if(q && q.data){ img = q; break; }
    }
    if(!img){
      var why = (data.candidates && data.candidates[0] && data.candidates[0].finishReason) || "";
      throw new Error("模型沒有回傳圖片" + (why ? "（" + why + "）" : "") + "，換句話說說看再試一次。");
    }

    var mime = img.mimeType || img.mime_type || "image/png";
    var url = "data:" + mime + ";base64," + img.data;

    convo.push({ role: "user", parts: parts });
    convo.push({ role: "model", parts: [{ inline_data: { mime_type: mime, data: img.data } }] });

    turns.pop();
    turns.push({ role: "ai", url: url, b64: img.data, mime: mime,
                 note: text ? "依照：" + text : "" });
  }catch(e){
    turns.pop();
    turns.push({ role: "err", html: errHtml(e.message || "") });
    atts = sentAtts; renderAtt();
    $("ask").value = mine.text;
  }finally{
    busy = false; refreshSend(); renderThread();
  }
}

function errHtml(m){
  var fix = '<br><button class="fix" onclick="showKey()">開啟金鑰設定</button>';
  if(/API key not valid|API_KEY_INVALID/i.test(m)) return "金鑰不對或已被刪除。" + fix;
  if(/limit:\s*0/i.test(m))
    return "<b>免費方案對影像模型的額度是 0，要先開啟計費。</b><br>到 " +
           '<a href="https://console.cloud.google.com/billing" target="_blank" rel="noopener">console.cloud.google.com/billing</a>' +
           " 建立帳單帳戶並連結到金鑰所屬的專案。";
  if(/quota|RESOURCE_EXHAUSTED|rate limit/i.test(m)) return "短時間內請求太多，等 30～60 秒再試一次。";
  if(/SERVICE_DISABLED|has not been used|PERMISSION_DENIED/i.test(m))
    return "這個專案還沒啟用 Generative Language API。" + fix;
  return esc(m);
}

// 把某張結果放回輸入區，接著改
function useAsBase(i){
  var t = turns[i];
  atts.push({ url: t.url, b64: t.b64, marked: false });
  renderAtt(); refreshSend();
  $("ask").focus();
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

// ── 標記：在圖上塗要改的地方 ──
var mkState = null;

function markResult(i){ openMarker(turns[i].url, function(o){ atts.push(o); renderAtt(); refreshSend(); }); }
function markImage(i){
  openMarker(atts[i].url, function(o){ atts[i] = o; renderAtt(); refreshSend(); });
}

function openMarker(url, done){
  var d = document.createElement("div");
  d.className = "marker";
  d.id = "marker";
  d.innerHTML =
    '<div class="mk-top"><div><b>標記要改的地方</b>' +
      '<div class="sub">用手指塗，塗到的地方 AI 才會動</div></div>' +
      '<button class="mk-x" onclick="closeMarker()">✕</button></div>' +
    '<div class="mk-stage"><canvas id="mkcv"></canvas></div>' +
    '<div class="mk-bot">' +
      '<button class="mk-b on" id="mk-paint" onclick="mkMode(1)">塗抹</button>' +
      '<button class="mk-b" id="mk-erase" onclick="mkMode(0)">擦除</button>' +
      '<button class="mk-b" onclick="mkClear()">清除</button>' +
      '<button class="mk-done" onclick="mkDone()">完成</button>' +
    "</div>";
  document.body.appendChild(d);

  var im = new Image();
  im.onload = function(){
    var cv = $("mkcv");
    cv.width = im.width; cv.height = im.height;
    var ctx = cv.getContext("2d");
    var layer = document.createElement("canvas");
    layer.width = im.width; layer.height = im.height;

    mkState = { im: im, cv: cv, ctx: ctx, layer: layer, paint: true,
                brush: Math.max(26, Math.round(im.width * 0.05)), done: done, drawing: false, last: null };
    mkDraw();

    function pt(e){
      var r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (im.width / r.width),
               y: (e.clientY - r.top)  * (im.height / r.height) };
    }
    cv.onpointerdown = function(e){
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      mkState.drawing = true; mkState.last = null; mkStroke(pt(e));
    };
    cv.onpointermove = function(e){ if(mkState.drawing){ e.preventDefault(); mkStroke(pt(e)); } };
    cv.onpointerup = cv.onpointercancel = function(e){
      mkState.drawing = false; mkState.last = null;
      try{ cv.releasePointerCapture(e.pointerId); }catch(err){}
    };
  };
  im.src = url;
}

function mkStroke(p){
  var s = mkState, x = s.layer.getContext("2d");
  x.globalCompositeOperation = s.paint ? "source-over" : "destination-out";
  x.strokeStyle = "#FF00E5"; x.fillStyle = "#FF00E5";
  x.lineCap = "round"; x.lineJoin = "round"; x.lineWidth = s.brush;
  if(s.last){ x.beginPath(); x.moveTo(s.last.x, s.last.y); x.lineTo(p.x, p.y); x.stroke(); }
  else { x.beginPath(); x.arc(p.x, p.y, s.brush / 2, 0, Math.PI * 2); x.fill(); }
  x.globalCompositeOperation = "source-over";
  s.last = p;
  mkDraw();
}

function mkDraw(){
  var s = mkState;
  s.ctx.clearRect(0, 0, s.cv.width, s.cv.height);
  s.ctx.drawImage(s.im, 0, 0);
  s.ctx.globalAlpha = 0.45;
  s.ctx.drawImage(s.layer, 0, 0);
  s.ctx.globalAlpha = 1;
}

function mkMode(paint){
  mkState.paint = !!paint;
  $("mk-paint").classList.toggle("on", !!paint);
  $("mk-erase").classList.toggle("on", !paint);
}

function mkClear(){
  mkState.layer.getContext("2d").clearRect(0, 0, mkState.layer.width, mkState.layer.height);
  mkDraw();
}

function closeMarker(){ var m = $("marker"); if(m) m.remove(); mkState = null; }

function mkDone(){
  var s = mkState;
  var url = s.cv.toDataURL("image/jpeg", 0.92);
  var out = { url: url, b64: url.split(",")[1], marked: true };
  var cb = s.done;
  closeMarker();
  cb(out);
}

// ── 分享 ──
async function shareTurn(i){
  var t = turns[i];
  var blob = await (await fetch(t.url)).blob();
  var f = new File([blob], "施工模擬.jpg", { type: blob.type || "image/jpeg" });
  if(navigator.canShare && navigator.canShare({ files: [f] })){
    try{ await navigator.share({ files: [f], text: t.note || "施工模擬" }); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  var a = document.createElement("a");
  a.download = "施工模擬.jpg"; a.href = t.url; a.click();
}

// ── 金鑰 ──
function showKey(){
  var old = $("keymo"); if(old) old.remove();
  var d = document.createElement("div");
  d.id = "keymo";
  d.innerHTML =
    '<div class="ov" onclick="closeKey()"></div>' +
    '<div class="mo"><div class="mo-t">Google Gemini 金鑰</div>' +
    '<div class="mo-d">到 <b>aistudio.google.com/apikey</b> 申請，貼進來按「測試」確認。' +
    '金鑰只存在這台裝置的瀏覽器。<br><span style="color:var(--faint)">版本 ' + BUILD + "</span></div>" +
    '<input id="keyin" type="text" placeholder="AIza..." autocomplete="off" spellcheck="false" ' +
      'autocapitalize="off" autocorrect="off" value="' + API_KEY + '">' +
    '<div class="kinfo" id="kinfo"></div>' +
    '<div class="mo-r"><button onclick="closeKey()">取消</button>' +
    '<button onclick="testKey()">測試</button>' +
    '<button class="main" onclick="saveKey()">儲存</button></div></div>';
  document.body.appendChild(d);
}
function closeKey(){ var m = $("keymo"); if(m) m.remove(); }
function clean(s){ return (s || "").replace(/\s+/g, ""); }

async function testKey(){
  var el = $("kinfo"), v = clean($("keyin").value);
  if(!v){ el.textContent = "請先貼上金鑰"; el.className = "kinfo bad"; return; }
  if(v.indexOf("AIza") !== 0){
    el.textContent = "⚠ 金鑰應該以 AIza 開頭，你可能複製到金鑰的名稱";
    el.className = "kinfo bad"; return;
  }
  el.textContent = "測試中…"; el.className = "kinfo";
  try{
    var r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1",
                        { headers: { "x-goog-api-key": v } });
    var d = await r.json();
    if(d.error){ el.textContent = "✕ " + d.error.message; el.className = "kinfo bad"; }
    else { el.textContent = "✓ 金鑰有效，按「儲存」就能用"; el.className = "kinfo ok"; }
  }catch(e){ el.textContent = "✕ 連線失敗：" + e.message; el.className = "kinfo bad"; }
}

function saveKey(){
  var v = clean($("keyin").value);
  API_KEY = v;
  if(v) localStorage.setItem("gemini_api_key", v);
  else localStorage.removeItem("gemini_api_key");
  imgModel = ""; localStorage.removeItem(MODEL_KEY);
  closeKey(); paintKey(); refreshSend(); renderThread();
}

function paintKey(){ $("kdot").style.background = API_KEY ? "var(--green)" : "#C6CEDC"; }

paintKey();
renderAtt();
renderThread();
refreshSend();
</script>
